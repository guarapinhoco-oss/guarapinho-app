  }

  // ---------- Fila de pedidos (comanda) ----------
  // Cada pedido entra a la fila apenas se toma, con un número del turno y la seña del cliente (camiseta + una palabra).
  // Servido y cobrado son marcas aparte: sale de la fila solo con las dos, o cancelado con motivo. Todo queda en este
  // celular (PED = en la fila, FH = ya terminados en este turno) y el resumen viaja al servidor en la nota del cierre.
  var FH = leerLocal('gp_fila_hist') || [];
  var COLORES = [['Roja', '#d62f2f'], ['Negra', '#1d1d1d'], ['Blanca', '#ffffff'], ['Azul', '#2457c5'], ['Verde', '#2e9b45'], ['Amarilla', '#ffd21f'], ['Gris', '#9aa3a0'], ['Rosada', '#f28bb8'], ['Naranja', '#f57c1f'], ['Café', '#7a4b2a']];
  var PALABRAS = ['Señor', 'Señora', 'Joven', 'Niño', 'Niña', 'Pareja', 'Gorra', 'Gafas', 'Moto', 'Perro'];
  var MOTIVOS = ['Se equivocó al tomarlo', 'El cliente cambió de idea', 'Se fue sin pagar', 'Otro'];
  function guardarFH() { guardarLocal('gp_fila_hist', FH); }
  function filaNum() { var n = (Number(leerLocal('gp_fila_num')) || 0) + 1; guardarLocal('gp_fila_num', n); return n; }
  function filaReiniciar() { if (PED.length) return; FH = []; guardarFH(); guardarLocal('gp_fila_num', 0); }
  function guardarPedidos() {
    PED.forEach(function (x) { if (!x.num) x.num = filaNum(); }); // pedidos guardados antes de la fila
    guardarLocal('gp_pedidos', PED); pintarEstadoCaja();
  }
  function pedidoActivo() { return OP.pedidoActivo ? PED.filter(function (x) { return x.id === OP.pedidoActivo; })[0] || null : null; }
  function totalItems(items) { return items.reduce(function (a, it) { var p = buscarProducto(it.producto); return a + (p ? p.precio * it.cantidad : 0); }, 0); }
  function minutosDesde(ms) { return Math.max(0, Math.floor((Date.now() - ms) / 60000)); }
  function horaDe(ms) { return new Date(ms).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Bogota' }); }
  function nombrePedido(x) { return '#' + (x.num || '?') + (x.nombre ? ' · ' + x.nombre : ''); }
  function sinCobrar() { return PED.filter(function (x) { return !x.cobrado; }); }
  /** Orden de atención: primero lo servido que falta cobrar, después lo que falta servir, del más viejo al más nuevo. */
  function filaOrden() {
    var serv = PED.filter(function (x) { return x.servido; }).sort(function (a, b) { return a.servido - b.servido; });
    var pend = PED.filter(function (x) { return !x.servido; }).sort(function (a, b) { return a.creado - b.creado; });
    return { serv: serv, pend: pend };
  }

  /** Guarda el carrito; si es un pedido de la fila sin cobrar, el pedido se actualiza al mismo tiempo. */
  function guardarCarrito() {
    guardarLocal('gp_carrito', OP.carrito);
    var pa = pedidoActivo();
    if (pa && !pa.cobrado && OP.carrito.length) { pa.items = JSON.parse(JSON.stringify(OP.carrito)); guardarPedidos(); }
  }
  function soltarCarrito() { OP.carrito = []; OP.pedidoActivo = null; guardarLocal('gp_carrito', []); borrarLocal('gp_pedido_activo'); }
  function quitarPedido(id) { if (!id) return; PED = PED.filter(function (x) { return x.id !== id; }); guardarPedidos(); }
  /** Saca el pedido de la fila y lo deja en el historial del turno (para el resumen del cierre). */
  function terminarPedido(x, extra) {
    FH.push(Object.assign({ num: x.num, nombre: x.nombre, creado: x.creado, servido: x.servido || null, cobrado: x.cobrado || null, directo: !!x.directo }, extra || {}));
    guardarFH(); quitarPedido(x.id);
  }

  // Selector de la seña del cliente: un color de camiseta y una palabra, más una seña escrita opcional.
  function htmlSena(compacto) {
    return '<label>Color de camiseta</label><div class="colores' + (compacto ? ' compacto' : '') + '">' + COLORES.map(function (c) {
      return '<button type="button" class="color" data-color="' + c[0] + '" aria-label="Camiseta ' + c[0].toLowerCase() + '"><i style="background:' + c[1] + '"></i>' + c[0] + '</button>';
    }).join('') + '</div><label>¿Quién?</label><div class="palabras">' + PALABRAS.map(function (w) { return '<button type="button" class="sec" data-palabra="' + w + '">' + w + '</button>'; }).join('') + '</div>' +
      '<input class="sena-otra" maxlength="30" placeholder="Otra seña (opcional): ej. bolso morado">';
  }
  function activarSena(m, alCambiar) {
    var st = { color: '', palabra: '' };
    var tocar = function (sel, k, attr) {
      $$(sel, m).forEach(function (b) {
        b.onclick = function () { var v = b.getAttribute(attr); st[k] = st[k] === v ? '' : v; $$(sel, m).forEach(function (x) { x.classList.toggle('sel', x.getAttribute(attr) === st[k]); }); alCambiar(); };
      });
    };
    tocar('[data-color]', 'color', 'data-color'); tocar('[data-palabra]', 'palabra', 'data-palabra');
    m.querySelector('.sena-otra').addEventListener('input', alCambiar);
    return function () {
      var p = [];
      if (st.color) p.push('Camiseta ' + st.color.toLowerCase());
      if (st.palabra) p.push(st.palabra.toLowerCase());
      var o = m.querySelector('.sena-otra').value.trim(); if (o) p.push(o);
      return p.join(' · ').slice(0, 60);
    };
  }

  /** "A la fila": guarda el carrito como pedido con su número y la seña del cliente. Si se está editando uno, lo actualiza. */
  function guardarPedido() {
    if (OP.pedidoActivo) { var pa = pedidoActivo(); soltarCarrito(); aviso((pa ? nombrePedido(pa) : 'Pedido') + ' actualizado. Sigue en la fila.', 'exito'); pintarVender(); pintarCarrito(); return; }
    var num = (Number(leerLocal('gp_fila_num')) || 0) + 1;
    var m = modal('¿Quién es? · Pedido #' + num, '<p class="gris peq" style="margin-top:0">' + vasosCarrito() + ' vaso(s) · ' + pesos(totalCarrito()) + '. Toque el color de la camiseta y una palabra.</p>' + htmlSena(false) +
      '<div class="vista-ref"><small>Así sale en la fila</small><span id="mRef">#' + num + '</span></div>' +
      '<div class="acciones"><button class="sec" id="mSinSena">Sin seña</button><button class="amarillo" id="mPedOk">Enviar a la fila</button></div>');
    var leer = activarSena(m, function () { var r = leer(); m.querySelector('#mRef').textContent = '#' + num + (r ? ' · ' + r : ''); });
    var ok = function (ref) {
      var x = { id: idNuevo('P'), num: filaNum(), nombre: ref, items: JSON.parse(JSON.stringify(OP.carrito)), creado: Date.now(), usuario: SES.usuario, servido: null, cobrado: null };
      PED.push(x); soltarCarrito(); guardarPedidos(); m.cerrar(); vibrar(15);
      aviso(nombrePedido(x) + ' quedó en la fila', 'exito'); pintarVender(); pintarCarrito();
    };
    m.querySelector('#mPedOk').onclick = function () { ok(leer()); };
    m.querySelector('#mSinSena').onclick = function () { ok(''); };
  }

  /** Aviso arriba de Vender: cuántos hay en la fila y cuál lleva más tiempo esperando. */
  function pintarPorCobrar() {
    var el = $('porCobrar'); if (!el) return;
    if (!PED.length || !OP.turno) { el.innerHTML = ''; return; }
    var f = filaOrden(), primero = f.serv[0] || f.pend[0];
    var min = minutosDesde(primero.servido && !primero.cobrado ? primero.servido : primero.creado);
    el.innerHTML = '<button class="fila-aviso' + (min >= 10 ? ' rojo' : '') + '" id="verFila"><span><b>' + PED.length + ' pedido' + (PED.length === 1 ? '' : 's') + ' en la fila</b>' +
      '<small>' + (f.serv.length ? 'Falta cobrar ' + esc(nombrePedido(f.serv[0])) : 'Sigue ' + esc(nombrePedido(primero)) + ' · ' + min + ' min') + '</small></span><em>Ver fila</em></button>';
    $('verFila').onclick = function () { opIr('fila'); };
  }
  setInterval(function () {
    if (document.querySelector('.velo-modal')) return;
    if (OP.tab === 'vender') pintarPorCobrar(); else if (OP.tab === 'fila' && OP.turno) pintarFila();
  }, 30000);

  function tarjetaPedido(x) {
    var serv = !!x.servido, min = minutosDesde(serv ? x.servido : x.creado);
    var cls = serv ? 'serv' : min >= 10 ? 'roj' : min >= 5 ? 'amb' : '';
    var items = x.items.map(function (it) { return '<li>' + it.cantidad + ' × ' + esc(it.producto) + (it.opcion ? ' <small>· ' + esc(it.opcion) + '</small>' : '') + '</li>'; }).join('');
    var est = (serv ? '<span class="sv-p">Servido ✓</span>' : '') +
      (x.cobrado ? '<span class="ok-p">Cobrado · ' + (x.cobrado.medio === 'TRANSFERENCIA' ? 'transferencia' : 'efectivo') + '</span>' : '<span class="no-p">Sin cobrar · ' + pesos(totalItems(x.items)) + '</span>');
    var acc = (!x.cobrado ? '<button class="' + (serv ? 'amarillo' : 'sec') + '" data-cobrar="' + esc(x.id) + '">Cobrar' + (serv ? ' ' + pesos(totalItems(x.items)) : '') + '</button>' : '') +
      (!serv ? '<button data-servido="' + esc(x.id) + '">✓ Servido</button>' : '');
    return '<div class="tk ' + cls + '" data-tk="' + esc(x.id) + '"><div class="cab"><span class="n">#' + x.num + '</span><span class="ref">' + (x.nombre ? esc(x.nombre) : 'Sin seña') +
      '<small>' + (serv ? 'Servido ' + horaDe(x.servido) : 'Tomado ' + horaDe(x.creado)) + '</small></span><span class="min">' + min + ' min</span></div>' +
      '<ul>' + items + '</ul><div class="est">' + est + '</div><div class="acc">' + acc + '</div></div>';
  }

  function pintarFila() {
    var f = filaOrden();
    $('opVista').innerHTML = '<div class="comanda">' + (!PED.length
      ? '<div class="vacio"><b>No hay pedidos en la fila.</b><br>Tome el pedido en Vender y toque "A la fila".</div>'
      : (f.serv.length ? '<h3 class="rojo"><span>Servidos · falta cobrar</span><span>' + f.serv.length + '</span></h3>' + f.serv.map(tarjetaPedido).join('') : '') +
        (f.pend.length ? '<h3><span>Por servir · en orden</span><span>' + f.pend.length + '</span></h3>' + f.pend.map(tarjetaPedido).join('') : '') +
        '<p class="gris peq">Verde: menos de 5 min · Amarillo: 5 a 10 · Rojo: más de 10. Toque un pedido para agregarle, cambiarlo o cancelarlo.</p>') + '</div>';
    $$('[data-servido]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); marcarServido(b.getAttribute('data-servido')); }; });
    $$('[data-cobrar]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); cobrarPedido(b.getAttribute('data-cobrar')); }; });
    $$('[data-tk]').forEach(function (t) { t.onclick = function () { abrirPedido(t.getAttribute('data-tk')); }; });
  }

  function marcarServido(id) {
    var x = PED.filter(function (y) { return y.id === id; })[0]; if (!x) return;
    x.servido = Date.now(); vibrar(20);
    if (x.cobrado) { terminarPedido(x); aviso(nombrePedido(x) + ' entregado', 'exito'); }
    else { guardarPedidos(); aviso(nombrePedido(x) + ' servido. Falta cobrarlo.', 'error'); }
    if (OP.pedidoActivo === id) soltarCarrito();
    pintarTab();
  }

  /** Carga el pedido en el carrito para cobrarlo o agregarle productos. */
  function cargarPedido(x) {
    if (OP.carrito.length && OP.pedidoActivo !== x.id) {
      if (!OP.pedidoActivo) { aviso('Primero cobre o mande a la fila el pedido que está armando.', 'error'); return false; }
      soltarCarrito();
    }
    OP.carrito = JSON.parse(JSON.stringify(x.items)); OP.pedidoActivo = x.id;
    guardarLocal('gp_carrito', OP.carrito); guardarLocal('gp_pedido_activo', x.id);
    return true;
  }
  function cobrarPedido(id) {
    var x = PED.filter(function (y) { return y.id === id; })[0]; if (!x || x.cobrado) return;
    if (!cargarPedido(x)) return;
    setTimeout(cobrar, 50);
  }

  function abrirPedido(id) {
    var x = PED.filter(function (y) { return y.id === id; })[0]; if (!x) return;
    var m = modal(nombrePedido(x), '<p class="gris" style="margin-top:0">Tomado ' + horaDe(x.creado) + ' (hace ' + minutosDesde(x.creado) + ' min)' + (x.servido ? ' · servido ' + horaDe(x.servido) : '') + (x.cobrado ? ' · cobrado' : '') + '</p>' +
      '<div class="lista">' + x.items.map(function (it) { var p = buscarProducto(it.producto); return '<div class="item"><div class="d"><b>' + it.cantidad + '× ' + esc(it.producto) + '</b>' + (it.opcion ? '<span>' + esc(it.opcion) + '</span>' : '') + '</div><div class="v">' + pesos(p ? p.precio * it.cantidad : 0) + '</div></div>'; }).join('') + '</div>' +
      '<div class="linea-carrito" style="border:none"><div class="d"><b>Total</b></div><b class="total-grande" style="font-size:24px">' + pesos(totalItems(x.items)) + '</b></div>' +
      (x.cobrado
        ? '<p class="gris peq">Ya está cobrado: no se puede cambiar. Si piden algo más, tómelo como un pedido nuevo.</p><div class="acciones">' + (!x.servido ? '<button id="mPedServ">✓ Servido</button>' : '') + '</div>'
        : '<div class="acciones"><button class="peligro" id="mPedDel">Cancelar</button><button class="sec" id="mPedMas">Agregar más</button><button class="amarillo" id="mPedCob">Cobrar</button></div>'));
    if (x.cobrado) { var bs = m.querySelector('#mPedServ'); if (bs) bs.onclick = function () { m.cerrar(); marcarServido(id); }; return; }
    m.querySelector('#mPedCob').onclick = function () { if (!cargarPedido(x)) return; m.cerrar(); setTimeout(cobrar, 220); };
    m.querySelector('#mPedMas').onclick = function () { if (!cargarPedido(x)) return; m.cerrar(); opIr('vender'); aviso('Agregue productos a ' + nombrePedido(x), 'exito'); };
    m.querySelector('#mPedDel').onclick = function () { m.cerrar(); setTimeout(function () { cancelarPedido(x); }, 220); };
  }

  function cancelarPedido(x) {
    var st = { motivo: '' };
    var m = modal('Cancelar ' + nombrePedido(x), '<p class="gris" style="margin-top:0">' + pesos(totalItems(x.items)) + '. ¿Por qué se cancela?</p>' +
      '<div class="motivos">' + MOTIVOS.map(function (r) { return '<button class="sec" data-motivo="' + r + '">' + r + '</button>'; }).join('') + '</div>' +
      '<input id="mCanNota" maxlength="60" placeholder="Nota (opcional)">' +
      '<div class="acciones"><button class="sec" id="mCanNo">Volver</button><button class="peligro" id="mCanSi">Cancelar pedido</button></div>' +
      '<p class="gris peq">Queda con el motivo y la hora en el resumen del cierre de caja.</p>');
    $$('[data-motivo]', m).forEach(function (b) { b.onclick = function () { st.motivo = b.getAttribute('data-motivo'); $$('[data-motivo]', m).forEach(function (y) { y.classList.toggle('sel', y === b); }); }; });
    m.querySelector('#mCanNo').onclick = function () { m.cerrar(); };
    m.querySelector('#mCanSi').onclick = function () {
      if (!st.motivo) { aviso('Toque el motivo', 'error'); return; }
      var nota = m.querySelector('#mCanNota').value.trim();
      if (OP.pedidoActivo === x.id) soltarCarrito();
      terminarPedido(x, { cancelado: { motivo: st.motivo + (nota ? ': ' + nota : ''), hora: Date.now(), usuario: SES.nombre } });
      m.cerrar(); aviso(nombrePedido(x) + ' cancelado', 'exito'); pintarTab();
    };
  }

  /** Lo que pasa con la fila al registrar una venta. */
  function filaTrasCobro(venta, ref, entregado) {
    var cob = { medio: venta.medio, total: venta.total, hora: Date.now(), venta: venta.id };
    var pa = pedidoActivo();
    if (pa) {
      pa.cobrado = cob; pa.items = JSON.parse(JSON.stringify(OP.carrito));
      if (pa.servido) terminarPedido(pa); else guardarPedidos();
      return pa;
    }
    var x = { id: idNuevo('P'), num: filaNum(), nombre: ref, items: JSON.parse(JSON.stringify(OP.carrito)), creado: Date.now(), usuario: SES.usuario, servido: null, cobrado: cob };
    if (entregado) { x.servido = x.creado; x.directo = true; FH.push({ num: x.num, nombre: x.nombre, creado: x.creado, servido: x.servido, cobrado: cob, directo: true }); guardarFH(); }
    else { PED.push(x); guardarPedidos(); }
    return x;
  }

  /** Resumen del turno para el cierre: pedidos tomados, cobrados, cancelados y espera promedio. */
  function filaResumen() {
    var todos = FH.concat(PED), canc = FH.filter(function (x) { return x.cancelado; });
    var esperas = FH.filter(function (x) { return x.servido && !x.directo && !x.cancelado; }).map(function (x) { return x.servido - x.creado; });
    return {
      tomados: todos.length, cobrados: todos.filter(function (x) { return x.cobrado; }).length, sinCobrar: sinCobrar().length, cancelados: canc,
      espera: esperas.length ? Math.round(esperas.reduce(function (a, b) { return a + b; }, 0) / esperas.length / 60000) : null
    };
  }
  function filaResumenTexto() {
    var r = filaResumen(); if (!r.tomados) return '';
    return ('Fila: ' + r.tomados + ' pedidos, ' + r.cobrados + ' cobrados' + (r.cancelados.length ? ', ' + r.cancelados.length + ' cancelado' + (r.cancelados.length === 1 ? '' : 's') + ' (' + r.cancelados.map(function (x) { return '#' + x.num + ' ' + x.cancelado.motivo; }).join('; ') + ')' : '') +
      (r.espera != null ? ', espera prom. ' + r.espera + ' min' : '')).slice(0, 200);
  }
  function resumenFilaHtml() {
    var r = filaResumen(); if (!r.tomados) return '';
    var motivos = {}; r.cancelados.forEach(function (x) { var k = x.cancelado.motivo.split(':')[0]; motivos[k] = (motivos[k] || 0) + 1; });
    return '<div class="resumen-fila"><div class="l"><span>Pedidos tomados<small>Desde que se abrió la caja</small></span><b>' + r.tomados + '</b></div>' +
      '<div class="l"><span>Cobrados</span><b class="ok">' + r.cobrados + '</b></div>' +
      (r.sinCobrar ? '<div class="l"><span>Sin cobrar</span><b class="error">' + r.sinCobrar + '</b></div>' : '') +
      '<div class="l"><span>Cancelados' + (r.cancelados.length ? '<small>' + Object.keys(motivos).map(function (k) { return motivos[k] + ' × ' + esc(k.toLowerCase()); }).join(' · ') + '</small>' : '') + '</span><b>' + r.cancelados.length + '</b></div>' +
      (r.espera != null ? '<div class="l"><span>Espera promedio<small>De tomado a servido</small></span><b>' + r.espera + ' min</b></div>' : '') + '</div>';
  }

  function buscarProducto(nombre) { return OP.productos.filter(function (p) { return p.nombre === nombre; })[0]; }

  function adiciones() { return OP.productos.filter(function (p) { return p.adicion; }); }

  function elegirTamano(linea) {
    var l = lineas().filter(function (x) { return x.linea === linea; })[0];
    var esAdic = l.variantes.every(function (v) { return v.adicion; });
    var st = { cant: 1, opcion: l.opciones.length ? l.opciones[0] : '', adic: {} };
    var orden = ['Pequeño', 'Mediano', 'Grande'];
    var vars = l.variantes.slice().sort(function (a, b) { return orden.indexOf(a.tamano) - orden.indexOf(b.tamano); });
    var extras = esAdic ? [] : adiciones();
    var m = modal(l.grupo,
      '<p class="gris" style="margin-top:0">' + esc(l.desc) + '</p>' +
      (l.opciones.length ? '<label>Borde</label><div class="opciones" id="mOpc">' + l.opciones.map(function (o) { return '<button data-o="' + esc(o) + '" class="' + (o === st.opcion ? 'sel' : '') + '">' + esc(o) + '</button>'; }).join('') + '</div>' : '') +
      '<div class="fila" style="margin-top:12px"><label style="margin:0">Cantidad</label><div class="auto stepper" id="mPaso"><button data-d="-1">−</button><span id="mCant">1</span><button data-d="1">+</button></div></div>' +
      (extras.length ? '<label style="margin-top:14px">Adiciones (se cobran aparte)</label><div id="mAdic">' + extras.map(function (a, i) {
        return '<div class="fila adic"><span>' + esc(a.etiqueta) + ' <b class="num">+' + pesos(a.precio) + '</b></span><div class="auto stepper"><button data-a="' + i + '" data-d="-1">−</button><span id="mA' + i + '">0</span><button data-a="' + i + '" data-d="1">+</button></div></div>';
      }).join('') + '</div>' : '') +
      '<label style="margin-top:14px">' + (esAdic ? 'Toque la adición para agregarla' : 'Toque el tamaño para agregarlo') + '</label><div class="tamanos">' + vars.map(function (v) {
        return '<button class="tamano t' + (orden.indexOf(v.tamano) + 1) + '" data-p="' + esc(v.nombre) + '">' + ICON.vaso + '<b>' + esc(v.tamano || v.etiqueta || v.nombre) + '</b><span>' + pesos(v.precio) + '</span></button>';
      }).join('') + '</div>');
    $$('#mOpc button', m).forEach(function (b) { b.onclick = function () { st.opcion = b.getAttribute('data-o'); $$('#mOpc button', m).forEach(function (x) { x.classList.toggle('sel', x === b); }); }; });
    $$('#mPaso button', m).forEach(function (b) { b.onclick = function () { st.cant = Math.max(1, Math.min(50, st.cant + Number(b.getAttribute('data-d')))); m.querySelector('#mCant').textContent = st.cant; }; });
    $$('#mAdic button', m).forEach(function (b) {
      b.onclick = function () {
        var i = b.getAttribute('data-a');
        st.adic[i] = Math.max(0, Math.min(50, (st.adic[i] || 0) + Number(b.getAttribute('data-d'))));
        m.querySelector('#mA' + i).textContent = st.adic[i];
      };
    });
    $$('.tamano', m).forEach(function (b) {
      b.onclick = function () {
        agregarAlCarrito(b.getAttribute('data-p'), st.cant, st.opcion);
        extras.forEach(function (a, i) { if (st.adic[i]) agregarAlCarrito(a.nombre, st.adic[i], ''); });
        vibrar(15); m.cerrar();
      };
    });
  }

  function agregarAlCarrito(producto, cant, opcion) {
    var ex = OP.carrito.filter(function (it) { return it.producto === producto && it.opcion === opcion; })[0];
    if (ex) ex.cantidad += cant; else OP.carrito.push({ producto: producto, cantidad: cant, opcion: opcion || '' });
    guardarCarrito();
    if (OP.tab === 'vender') pintarVender();
    pintarCarrito();
  }

  function totalCarrito() { return OP.carrito.reduce(function (a, it) { var p = buscarProducto(it.producto); return a + (p ? p.precio * it.cantidad : 0); }, 0); }
  function vasosCarrito() { return OP.carrito.reduce(function (a, it) { var p = buscarProducto(it.producto); return a + (p && p.adicion ? 0 : it.cantidad); }, 0); }

  function pintarCarrito() {
    var c = $('carrito'); if (!c) return;
    if (!OP.carrito.length || !OP.turno || OP.tab !== 'vender') { c.innerHTML = ''; return; }
    var pa = pedidoActivo();
    c.innerHTML = '<div class="caja" id="verCarrito"><div class="t">' + (pa ? '<em>' + esc(pa.nombre) + '</em>' : '') + '<b>' + pesos(totalCarrito()) + '</b><span>' + vasosCarrito() + ' vaso' + (vasosCarrito() === 1 ? '' : 's') + ' · ver</span></div><button class="guardar" id="btnGuardarPed">' + (pa ? 'Listo' : 'A la fila') + '</button><button class="amarillo" id="btnCobrar">Cobrar</button></div>';
    $('verCarrito').onclick = function (e) { if (e.target.closest('#btnCobrar') || e.target.closest('#btnGuardarPed')) return; verCarrito(); };
    $('btnGuardarPed').onclick = guardarPedido;
    $('btnCobrar').onclick = cobrar;
  }

  function verCarrito() {
    var m = modal('Pedido', '<div id="mLineas"></div><div class="acciones"><button class="peligro" id="mVaciar">Vaciar</button><button class="amarillo" id="mCobrar">Cobrar</button></div>');
    var pintar = function () {
      if (!OP.carrito.length) { m.cerrar(); return; }
      m.querySelector('#mLineas').innerHTML = OP.carrito.map(function (it, i) {
        var p = buscarProducto(it.producto);
        return '<div class="linea-carrito"><div class="d"><b>' + esc(it.producto) + '</b><span>' + (it.opcion ? esc(it.opcion) + ' · ' : '') + pesos(p.precio) + ' c/u</span></div>' +
          '<div class="stepper"><button data-i="' + i + '" data-d="-1">−</button><span>' + it.cantidad + '</span><button data-i="' + i + '" data-d="1">+</button></div>' +
          '<b class="num" style="min-width:76px;text-align:right">' + pesos(p.precio * it.cantidad) + '</b></div>';
      }).join('') + '<div class="linea-carrito" style="border:none"><div class="d"><b>Total</b></div><b class="total-grande" style="font-size:24px">' + pesos(totalCarrito()) + '</b></div>';
      $$('.stepper button', m).forEach(function (b) {
        b.onclick = function () {
          var it = OP.carrito[Number(b.getAttribute('data-i'))]; it.cantidad += Number(b.getAttribute('data-d'));
          if (it.cantidad <= 0) OP.carrito.splice(Number(b.getAttribute('data-i')), 1);
          guardarCarrito(); pintar(); pintarVender(); pintarCarrito();
        };
      });
    };
    pintar();
    if (OP.pedidoActivo) { var bv = m.querySelector('#mVaciar'); bv.textContent = 'Dejar en la fila'; bv.className = 'sec'; }
    m.querySelector('#mVaciar').onclick = function () { soltarCarrito(); m.cerrar(); pintarVender(); pintarCarrito(); };
    m.querySelector('#mCobrar').onclick = function () { m.cerrar(); setTimeout(cobrar, 220); };
  }

  function cobrar() {
    var total = totalCarrito();
    var mas18 = OP.carrito.some(function (it) { var p = buscarProducto(it.producto); return p && p.mas18; });
    var st = { medio: 'EFECTIVO', canal: OP.canales[0] || '' };
    var billetes = [0, 10000, 20000, 50000, 100000].filter(function (b) { return b === 0 || b >= total; }).slice(0, 6);
    var cobro = function () { return total + st.propina; };
    st.propina = 0;
    var pa = pedidoActivo();
    var m = modal(pa ? 'Cobrar ' + nombrePedido(pa) : 'Cobrar', '<div class="centro"><div class="gris peq">' + vasosCarrito() + ' vaso(s)</div><div class="total-grande" id="mTotal">' + pesos(total) + '</div><div class="gris peq" id="mConProp" hidden></div></div>' +
      (pa ? '' : '<div class="sena-cobro">' + htmlSena(true) + '<label class="fila" style="margin-top:10px"><input type="checkbox" id="mEntregado" class="auto"> <span>Ya se entregó (no pasa a la fila)</span></label></div>') +
      '<div' + (leerLocal('gp_propina_ok') ? '' : ' hidden') + '><label>Propina (aparte: no es venta)</label><div class="opciones" id="mProp"><button data-p="0" class="sel">Sin propina</button><button data-p="1000">' + pesos(1000) + '</button><button data-p="2000">' + pesos(2000) + '</button><button data-p="5000">' + pesos(5000) + '</button><button data-p="otra">Otra</button></div>' +
      '<input id="mPropina" placeholder="Valor de la propina" hidden></div>' +
      '<label>Medio de pago</label><div class="medios"><button data-m="EFECTIVO" class="sel">Efectivo</button><button data-m="TRANSFERENCIA">Transferencia</button></div>' +
      '<div id="mEf"><label for="mRecibido">Recibido</label><input id="mRecibido" placeholder="Opcional">' +
      '<div class="billetes">' + billetes.map(function (b) { return '<button class="sec" data-r="' + b + '">' + (b ? pesos(b) : 'Exacto') + '</button>'; }).join('') + '</div>' +
      '<div class="cambio" id="mCambio" style="display:none"><span>Cambio</span><b id="mCambioV"></b></div></div>' +
      '<div id="mTr" style="display:none"><label>¿Por dónde transfirió?</label><div class="opciones" id="mCanal">' + OP.canales.map(function (c, i) { return '<button data-c="' + esc(c) + '" class="' + (i === 0 ? 'sel' : '') + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
      '<p class="gris peq">Verifique que la transferencia llegó antes de entregar.</p></div>' +
      (mas18 ? '<label class="fila" style="margin-top:14px;color:var(--morado)"><input type="checkbox" id="m18" class="auto"> <span>Verifiqué que el cliente es mayor de edad (+18)</span></label>' : '') +
      '<label for="mNota">Nota (opcional)</label><input id="mNota" maxlength="200">' +
      '<div class="acciones"><button class="grande amarillo" id="mConfirmar">Registrar venta</button></div>');
    campoPesos(m.querySelector('#mRecibido'));
    var leerSena = pa ? function () { return ''; } : activarSena(m, function () {});
    var calc = function () {
      var r = numeroDe(m.querySelector('#mRecibido').value);
      var cb = m.querySelector('#mCambio');
      if (!m.querySelector('#mRecibido').value) { cb.style.display = 'none'; return; }
      cb.style.display = 'flex';
      m.querySelector('#mCambioV').textContent = r >= cobro() ? pesos(r - cobro()) : 'Falta ' + pesos(cobro() - r);
    };
    var pintarProp = function () {
      var cp = m.querySelector('#mConProp');
      cp.hidden = !st.propina;
      cp.textContent = st.propina ? '+ propina ' + pesos(st.propina) + ' = cobrar ' + pesos(cobro()) : '';
      calc();
    };
    campoPesos(m.querySelector('#mPropina'));
    $$('#mProp button', m).forEach(function (b) {
      b.onclick = function () {
        $$('#mProp button', m).forEach(function (x) { x.classList.toggle('sel', x === b); });
        var v = b.getAttribute('data-p'), inp = m.querySelector('#mPropina');
        inp.hidden = v !== 'otra';
        if (v === 'otra') { inp.focus(); st.propina = numeroDe(inp.value) || 0; } else { inp.value = ''; st.propina = Number(v); }
        pintarProp();
      };
    });
    m.querySelector('#mPropina').addEventListener('input', function () { st.propina = numeroDe(this.value) || 0; pintarProp(); });
    m.querySelector('#mRecibido').addEventListener('input', calc);
    $$('[data-r]', m).forEach(function (b) { b.onclick = function () { m.querySelector('#mRecibido').value = (Number(b.getAttribute('data-r')) || cobro()).toLocaleString('es-CO'); calc(); }; });
    $$('.medios button', m).forEach(function (b) {
      b.onclick = function () {
        st.medio = b.getAttribute('data-m');
        $$('.medios button', m).forEach(function (x) { x.classList.toggle('sel', x === b); });
        m.querySelector('#mEf').style.display = st.medio === 'EFECTIVO' ? '' : 'none';
        m.querySelector('#mTr').style.display = st.medio === 'TRANSFERENCIA' ? '' : 'none';
      };
    });
    $$('#mCanal button', m).forEach(function (b) { b.onclick = function () { st.canal = b.getAttribute('data-c'); $$('#mCanal button', m).forEach(function (x) { x.classList.toggle('sel', x === b); }); }; });
    m.querySelector('#mConfirmar').onclick = function () {
      var recibido = st.medio === 'EFECTIVO' && m.querySelector('#mRecibido').value ? numeroDe(m.querySelector('#mRecibido').value) : '';
      if (st.propina < 0 || st.propina > 100000) { aviso('La propina debe estar entre $0 y $100.000', 'error'); return; }
      if (recibido !== '' && recibido < cobro()) { aviso('El efectivo recibido no alcanza', 'error'); return; }
      if (mas18 && !m.querySelector('#m18').checked) { aviso('Confirme que el cliente es mayor de edad', 'error'); return; }
      var venta = {
        id: idNuevo('V'), usuario: SES.usuario, turno: OP.turno.id, items: OP.carrito.map(function (it) { return { producto: it.producto, cantidad: it.cantidad, opcion: it.opcion }; }),
        medio: st.medio, canal: st.medio === 'TRANSFERENCIA' ? st.canal : '', recibido: recibido, propina: st.propina, nota: m.querySelector('#mNota').value.trim(), mas18: mas18,
        horaCliente: new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }), hora24: hora24(), total: total, vasos: vasosCarrito(),
        detalle: OP.carrito.map(function (it) { return it.cantidad + '× ' + it.producto + (it.opcion ? ' (' + it.opcion + ')' : ''); }).join('; ')
      };
      // Primero queda guardada en el celular; así no se pierde si se cae el internet.
      agregarCola(venta);
      var fx = filaTrasCobro(venta, leerSena(), !pa && m.querySelector('#mEntregado').checked);
      soltarCarrito();
      m.cerrar(); vibrar([20, 40, 20]);
      aviso('Venta registrada · ' + pesos(total) + (st.propina ? ' + propina ' + pesos(st.propina) : '') + (recibido !== '' && recibido > cobro() ? ' · cambio ' + pesos(recibido - cobro()) : '') + (fx.servido ? '' : ' · ' + nombrePedido(fx) + ' en la fila'), 'exito', 4000);
      pintarTab();
      enviarCola();
    };
  }

  /** Envía la cola en orden, de a un movimiento. Si no hay señal reintenta cada 15 segundos y apenas vuelve la conexión. */
  var ENVIANDO = false, T_COLA = null;
  function enviarCola() {
    if (ENVIANDO || !SES || SES.rol === 'SOCIO') return;
    var c = cola().filter(function (x) { return !x.error; });
    if (!c.length) return;
    ENVIANDO = true; clearTimeout(T_COLA);
    var x = c[0], tipo = x.tipo || 'venta', p;
    if (tipo === 'venta') { var d = JSON.parse(JSON.stringify(x)); delete d.total; delete d.detalle; delete d.error; delete d.vasos; p = llamar('opRegistrarVenta', [d]); }
    else if (tipo === 'abrir') p = llamar('opAbrirTurno', [x.base, { id: x.id, fecha: x.local.fecha, hora: x.local.hora }]);
    else if (tipo === 'gasto') p = llamar('opGastoCaja', [{ id: x.id, turno: x.turno, categoria: x.categoria, descripcion: x.descripcion, proveedor: x.proveedor, valor: x.valor, hora24: x.local.hora }]);
    else p = llamar('opCerrarTurno', [{ id: x.id, turno: x.turno, contado: x.contado, obs: x.obs, local: x.local }]);
    p.then(function (r) {
      var resto = cola().filter(function (y) { return y.id !== x.id; });
      var srv = OP.srv || { turno: null, ventas: [], gastos: [] };
      if (tipo === 'abrir' && r.turno) {
        resto.forEach(function (y) { if (y.turno === x.id) y.turno = r.turno.id; });
        OP.srv = { turno: r.turno, ventas: r.ventas || [], gastos: r.gastos || [] };
      } else if (tipo === 'venta' && r.turno && srv.turno && srv.turno.id === r.turno.id) {
        srv.turno = r.turno;
        if (!r.repetida) srv.ventas = [{ id: x.id, hora: x.hora24 || '', usuario: SES.usuario, vendedor: SES.nombre, detalle: x.detalle, total: x.total, propina: x.propina || 0, medio: x.medio, canal: x.canal, nota: x.nota, estado: 'ACTIVA' }].concat(srv.ventas || []);
      } else if (tipo === 'gasto' && r.turno) {
        OP.srv = { turno: r.turno, ventas: r.ventas || [], gastos: r.gastos || [] };
      } else if (tipo === 'cerrar' && r.turno && srv.turno && srv.turno.id === r.turno.id) {
        OP.srv = { turno: null, ventas: [], gastos: [] };
      }
      guardarCola(resto); guardarOp();
      ENVIANDO = false;
      if (!pendientes()) refrescarCaja().then(function () {}, function () {}); else if (OP.tab === 'ventas') repintarOp();
      enviarCola();
    }, function (e) {
      ENVIANDO = false;
      if (e.sesion || !SES) return; // la cola queda guardada; se envía cuando la persona vuelva a entrar
      if (!e.red) {
        var cc = cola(); cc.forEach(function (y) { if (y.id === x.id) y.error = e.message; }); guardarCola(cc);
        aviso('Un movimiento no se pudo guardar: ' + e.message, 'error', 7000);
        repintarOp(); enviarCola(); return;
      }
      pintarEstadoCaja();
      T_COLA = setTimeout(enviarCola, 15000);
    });
  }

  /** Trae el estado de la caja y solo vuelve a pintar si algo cambió (para no borrar lo que se esté escribiendo). */
  function refrescarCaja() {
    // Mientras haya movimientos por enviar manda lo del celular: así nada se cuenta dos veces.
    if (pendientes()) return Promise.resolve();
    var antes = JSON.stringify([OP.turno, OP.ventas, OP.gastos]);
    return api('opEstado').then(function (r) {
      opAplicarEstado(r);
      if (JSON.stringify([OP.turno, OP.ventas, OP.gastos]) !== antes) repintarOp();
    });
  }

  function textoMovimiento(x) {
    var tipo = x.tipo || 'venta';
    if (tipo === 'abrir') return { t: 'Apertura de caja', d: 'Base ' + pesos(x.base), v: '' };
    if (tipo === 'gasto') return { t: 'Gasto: ' + x.descripcion, d: x.categoria, v: '−' + pesos(x.valor) };
    if (tipo === 'cerrar') return { t: 'Cierre de caja', d: 'Contado ' + pesos(x.contado), v: '' };
    return { t: x.detalle, d: (x.medio === 'EFECTIVO' ? 'Efectivo' : 'Transferencia') + (x.propina ? ' · propina ' + pesos(x.propina) : ''), v: pesos(x.total) };
  }

  // ---------- Ventas del turno ----------
  function pintarVentasTurno() {
    var t = OP.turno, c = cola();
    if (!t && !c.length) { pintarAbrirCaja(); return; }
    var html = t ? '<div class="resumen-turno">' +
      '<div class="dato"><span>Ventas</span><b>' + t.ventasN + '</b><small>' + t.vasos + ' vasos</small></div>' +
      '<div class="dato"><span>Total</span><b>' + pesos(t.total) + '</b></div>' +
      '<div class="dato"><span>Efectivo</span><b>' + pesos(t.efectivo) + '</b></div>' +
      '<div class="dato"><span>Transferencia</span><b>' + pesos(t.transferencia) + '</b></div>' +
      '<div class="dato"><span>Propinas</span><b>' + pesos(t.propinas || 0) + '</b><small>aparte de ventas</small></div></div>' : '';
    if (c.length) {
      html += '<h3>Por enviar (' + c.length + ')</h3><div class="lista">' + c.map(function (v) {
        var m = textoMovimiento(v);
        return '<div class="item"><div class="d"><b>' + esc(m.t) + '</b><span>' + esc(v.hora24 || (v.local && v.local.hora) || v.horaCliente || '') + ' · ' + esc(m.d) + '</span>' +
          (v.error ? '<div class="error peq">' + esc(v.error) + '</div><div class="fila" style="margin-top:6px"><button class="sec auto" data-reint="' + v.id + '">Reintentar</button><button class="peligro auto" data-desc="' + v.id + '">Descartar</button></div>' : '<div class="peq gris">' + (SIN_RED ? 'Guardado en el celular. Se envía solo cuando vuelva la señal.' : 'Enviando…') + '</div>') +
          '</div><div class="v">' + esc(m.v) + '</div></div>';
      }).join('') + '</div>';
    }
    html += '<h3>Ventas de este turno</h3>' + (OP.ventas.length ? '<div class="lista">' + OP.ventas.map(function (v) {
      return '<div class="item ' + (v.estado !== 'ACTIVA' ? 'anulada' : '') + '"><div class="d"><b>' + esc(v.detalle) + '</b><span>' + esc(v.hora) + ' · ' + esc(v.vendedor) + ' · ' +
        (v.medio === 'EFECTIVO' ? 'Efectivo' : 'Transf.' + (v.canal ? ' ' + esc(v.canal) : '')) + (v.propina ? ' · propina ' + pesos(v.propina) : '') + (v.nota ? ' · ' + esc(v.nota) : '') + (v.estado !== 'ACTIVA' ? ' · Anulada: ' + esc(v.motivoAnulacion) : '') + '</span></div>' +
        '<div class="v">' + pesos(v.total) + '</div>' + (v.estado === 'ACTIVA' && (SES.rol === 'ADMIN' || v.usuario === SES.usuario) ? '<button class="link peq" data-anular="' + esc(v.id) + '">Anular</button>' : '') + '</div>';
    }).join('') + '</div>' : '<div class="vacio">Todavía no hay ventas en este turno.</div>');
    $('opVista').innerHTML = html;
    $$('[data-anular]').forEach(function (b) {
      b.onclick = function () {
        pedirTexto('Anular venta', 'Motivo (queda registrado)', 'Anular venta').then(function (motivo) {
          if (!motivo) return;
          if (pendientes()) { aviso('Espere a que se envíe lo pendiente para anular.', 'error'); return; }
          api('opAnularVenta', b.getAttribute('data-anular'), motivo).then(function (r) { opAplicarEstado(r); pintarVentasTurno(); aviso('Venta anulada', 'exito'); }).catch(function (e) { aviso(e.message, 'error'); });
        });
      };
    });
    $$('[data-reint]').forEach(function (b) { b.onclick = function () { var cc = cola(); cc.forEach(function (x) { delete x.error; }); guardarCola(cc); pintarVentasTurno(); enviarCola(); }; });
    $$('[data-desc]').forEach(function (b) {
      b.onclick = function () { confirmar('Descartar', 'Este movimiento no quedará registrado. ¿Descartarlo?', 'Descartar', true).then(function (s) { if (!s) return; guardarCola(cola().filter(function (x) { return x.id !== b.getAttribute('data-desc'); })); repintarOp(); }); };
    });
  }

  // ---------- Gastos de caja ----------
  function pintarGastosCaja() {
    $('opVista').innerHTML = '<div class="tarjeta"><h2>Gasto pagado de la caja</h2><p class="gris peq" style="margin-top:-6px">Hielo, limones, vasos… lo que se pague con plata de la caja. Queda en "Pagos a Proveedores".</p>' +
      '<label>Categoría</label><select id="gCat">' + OP.categorias.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select>' +
      '<label>¿Qué se compró?</label><input id="gDesc" maxlength="120" placeholder="Ej: 2 bolsas de hielo">' +
      '<div class="grid2"><div><label>Proveedor (opcional)</label><input id="gProv" maxlength="80"></div><div><label>Valor</label><input id="gValor" placeholder="$"></div></div>' +
      '<button class="grande" id="gGuardar" style="margin-top:14px">Registrar gasto</button></div>' +
      '<h3>Gastos de este turno</h3>' + (OP.gastos.length ? '<div class="lista">' + OP.gastos.map(function (g) {
        return '<div class="item ' + (g.estado !== 'ACTIVO' ? 'anulada' : '') + '"><div class="d"><b>' + esc(g.descripcion) + '</b><span>' + esc(g.hora) + ' · ' + esc(g.categoria) + (g.proveedor ? ' · ' + esc(g.proveedor) : '') + ' · ' + esc(g.usuario) + (g.pendiente ? ' · por enviar' : '') + '</span></div><div class="v">' + pesos(g.valor) + '</div>' +
          (g.estado === 'ACTIVO' && !g.pendiente ? '<button class="link peq" data-ag="' + esc(g.id) + '">Anular</button>' : '') + '</div>';
      }).join('') + '</div>' : '<div class="vacio">Sin gastos en este turno.</div>');
    campoPesos($('gValor'));
    $('gGuardar').onclick = function () {
      var g = { categoria: $('gCat').value, descripcion: $('gDesc').value.trim(), proveedor: $('gProv').value.trim(), valor: numeroDe($('gValor').value) };
      if (!g.descripcion || !g.valor) { aviso('Escriba qué se compró y el valor', 'error'); return; }
      if (g.valor > OP.turno.esperado) { aviso('En caja debería haber ' + pesos(OP.turno.esperado) + '; no alcanza para ese gasto.', 'error'); return; }
      g.tipo = 'gasto'; g.id = idNuevo('G'); g.turno = OP.turno.id; g.local = { fecha: hoyISO(), hora: hora24() };
      agregarCola(g); pintarGastosCaja(); aviso('Gasto registrado', 'exito');
      enviarCola();
    };
    $$('[data-ag]').forEach(function (b) {
      b.onclick = function () { confirmar('Anular gasto', '¿Anular este gasto? También se borra de "Pagos a Proveedores".', 'Anular', true).then(function (s) { if (!s) return; if (pendientes()) { aviso('Espere a que se envíe lo pendiente para anular.', 'error'); return; } api('opAnularGastoCaja', b.getAttribute('data-ag')).then(function (r) { opAplicarEstado(r); pintarGastosCaja(); }).catch(function (e) { aviso(e.message, 'error'); }); }); };
    });
  }

  // ---------- Cierre ----------
  function pintarCierre() {
    var t = OP.turno, pend = cola().length;
    $('opVista').innerHTML = '<div class="cuadre">' +
      '<div class="l"><span>Base inicial</span><span class="num">' + pesos(t.base) + '</span></div>' +
      '<div class="l"><span>+ Ventas en efectivo</span><span class="num">' + pesos(t.efectivo) + '</span></div>' +
      (t.propinasEfectivo ? '<div class="l"><span>+ Propinas en efectivo</span><span class="num">' + pesos(t.propinasEfectivo) + '</span></div>' : '') +
      '<div class="l"><span>− Gastos pagados de la caja</span><span class="num">' + pesos(t.gastos) + '</span></div>' +
      '<div class="l total"><span>Debe haber en efectivo</span><span class="num">' + pesos(t.esperado) + '</span></div></div>' +

      (t.propinas ? '<div class="l"><span>Propinas (para repartir, no es venta)</span><span class="num">' + pesos(t.propinas) + '</span></div>' : '') + '</div>' +
      '<div class="tarjeta" style="margin-top:12px"><h2>Cerrar caja</h2>' +
      (PED.length ? '<div class="alerta">⚠ No se puede cerrar: hay ' + PED.length + ' pedido(s) en la fila: ' + PED.map(function (x) { return esc(nombrePedido(x)) + (x.cobrado ? ' (falta servir)' : ' (sin cobrar)'); }).join(', ') + '. Cóbrelos y márquelos servidos, o cancélelos con motivo, en Fila.</div>' : '') +
      resumenFilaHtml() +
      (pend ? '<p class="gris peq">Hay ' + pend + ' movimiento(s) por enviar. El cierre queda guardado y se envía después de ellos cuando haya señal.</p>' : '') +
      '<label for="cContado">Efectivo contado (incluida la base)</label><input id="cContado" placeholder="$">' +
      '<div class="cambio" id="cDif" style="display:none"></div>' +
      '<label for="cObs">Observaciones</label><textarea id="cObs" maxlength="300" placeholder="Opcional"></textarea>' +
      '<button class="grande amarillo" id="cCerrar" style="margin-top:14px">Cerrar caja</button></div>';
    campoPesos($('cContado'));
    $('cContado').addEventListener('input', function () {
      var v = $('cContado').value.trim(); var d = $('cDif');
      if (!v) { d.style.display = 'none'; return; }
      var dif = numeroDe(v) - t.esperado; d.style.display = 'flex';
      d.style.background = dif === 0 ? 'var(--verde-claro)' : (dif < 0 ? 'var(--rojo-claro)' : 'var(--azul-claro)');
      d.innerHTML = '<span>' + (dif === 0 ? 'Cuadra' : dif < 0 ? 'Faltan' : 'Sobran') + '</span><b>' + pesos(Math.abs(dif)) + '</b>';
    });
    $('cCerrar').onclick = function () {
      var v = $('cContado').value.trim();
      if (PED.length) { aviso('Hay ' + PED.length + ' pedido(s) en la fila. Termínelos o cancélelos antes de cerrar.', 'error'); return; }
      if (!v) { aviso('Escriba el efectivo contado', 'error'); return; }
      if (SES.rol !== 'ADMIN' && t.abre && t.abre !== SES.nombre) { aviso('Esta caja la abrió ' + t.abre + '. La cierra esa persona o un administrador.', 'error'); return; }
      var dif = numeroDe(v) - t.esperado;
      confirmar('Cerrar caja', 'Efectivo contado: <b>' + pesos(numeroDe(v)) + '</b>.<br>' + (dif === 0 ? 'La caja cuadra.' : (dif < 0 ? 'Faltan ' : 'Sobran ') + '<b>' + pesos(Math.abs(dif)) + '</b>.') + '<br>Después de cerrar no se pueden registrar más ventas en este turno.', 'Cerrar caja').then(function (s) {
        if (!s) return;
        var contado = numeroDe(v);
        var rf = filaResumenTexto(), obs = $('cObs').value.trim();
        obs = rf ? (obs ? obs.slice(0, 300 - rf.length - 2) + '. ' : '') + rf : obs.slice(0, 300);
        agregarCola({ tipo: 'cerrar', id: idNuevo('C'), turno: t.id, contado: contado, obs: obs, local: { fecha: hoyISO(), hora: hora24() } });
        filaReiniciar();
        pintarEstadoCaja();
        var x = { total: t.total, vasos: t.vasos, propinas: t.propinas || 0, esperado: t.esperado, contado: contado, diferencia: contado - t.esperado };
        $('opVista').innerHTML = '<div class="abrir-caja"><img src="' + IMG.personaje + '" alt=""><div class="tarjeta"><h2>Caja cerrada</h2>' +
          '<div class="cuadre" style="box-shadow:none;padding:0"><div class="l"><span>Vendido</span><span>' + pesos(x.total) + '</span></div><div class="l"><span>Vasos</span><span>' + x.vasos + '</span></div>' + (x.propinas ? '<div class="l"><span>Propinas</span><span>' + pesos(x.propinas) + '</span></div>' : '') +
          '<div class="l"><span>Efectivo esperado</span><span>' + pesos(x.esperado) + '</span></div><div class="l"><span>Contado</span><span>' + pesos(x.contado) + '</span></div>' +
          '<div class="l total"><span>' + (x.diferencia === 0 ? 'Cuadró' : x.diferencia < 0 ? 'Faltante' : 'Sobrante') + '</span><span>' + pesos(Math.abs(x.diferencia)) + '</span></div></div>' +
          (SIN_RED ? '<p class="gris peq">Sin señal: el cierre quedó guardado en el celular y se envía solo cuando vuelva la conexión.</p>' : '') +
          '<button class="grande sec" id="cNueva" style="margin-top:14px">Abrir otra caja</button></div></div>';
        $('cNueva').onclick = function () { pintarAbrirCaja(); };
        aviso('Caja cerrada', 'exito');
        enviarCola();
      });
    };
  }
</script>

<script>
  // ================= PANEL ADMINISTRATIVO =================
  var AD = { seccion: 'inicio', productos: [], usuarios: [], cat: {}, hoy: '' };
  var SECCIONES = [
    { id: 'inicio', t: 'Inicio', i: 'inicio' },

  function panelAdmin() {

      '<div class="pie">' + esc(SES.nombre) + '<br>' + (lector ? 'Socio · solo lectura' : 'Administrador') + '</div></aside>' +
      '<div class="principal"><header class="barra"><button class="btn-menu" id="btnMenu" aria-label="Menú">' + ICON.menu + '</button>' +
      '<div class="titulo-seccion" id="tituloSeccion"></div>' +
      '<button class="sec btn-actualizar" id="btnActualizar" title="Traer las últimas ventas y movimientos" aria-label="Actualizar">' + ICON.actualizar + '<span class="ocultar-movil">Actualizar</span></button>' +
      (lector ? '<span class="chip gris">Solo lectura</span>' :

    $('btnMenu').onclick = function () { $('menu').classList.add('abierto'); $('velo').classList.add('visible'); };
    $('velo').onclick = cerrarMenu;
    $('btnActualizar').onclick = actualizarAhora;
    if ($('btnVender')) $('btnVender').onclick = function () { guardarLocal('gp_vista', 'caja'); panelOperador(); };
    pintarRed();
    $('btnAvatar').onclick = function () {
      var m = modal('Mi sesión', '<p><b>' + esc(SES.nombre) + '</b><br><span class="gris">' + esc(SES.usuario) + ' · ' + (lector ? 'Socio (solo lectura)' : 'Administrador') + '</span></p><div class="acciones"><button class="peligro" id="mSalir">' + ICON.salir + ' Cerrar sesión</button></div>');
      m.querySelector('#mSalir').onclick = function () { m.cerrar(); cerrarSesion(false); };
    };
    // Inicio se pide al mismo tiempo que los datos básicos, no después: ahorra un viaje completo al servidor.
    restaurarDisco();
    leerRapido('adminInicio', [], function () {}).catch(function () {});
    api('adminInit').then(function (r) {
      aplicarInit(r);
      if ($('btnLibro')) $('btnLibro').onclick = function () { window.open(AD.libro, '_blank'); };
      ir(location.hash ? location.hash.slice(1) : 'inicio');
      setTimeout(precargarPanel, 1200);
    }).catch(function (e) { fallaVista(e); });
    window.onhashchange = function () { var h = location.hash.slice(1); if (h && h !== AD.seccion && $('vista')) ir(h); };
  }
  function cerrarMenu() { if ($('menu')) { $('menu').classList.remove('abierto'); $('velo').classList.remove('visible'); } }

  function ir(sec) {
    var s = SECCIONES.filter(function (x) { return x.id === sec; })[0] || SECCIONES[0];
    AD.seccion = s.id;
    if (location.hash.slice(1) !== s.id) history.replaceState(null, '', '#' + s.id);
    $$('#nav a').forEach(function (a) { a.classList.toggle('activo', a.getAttribute('data-sec') === s.id); });
    $('tituloSeccion').textContent = s.t;
    $('vista').innerHTML = cargando();
    window.scrollTo(0, 0);
    VISTAS[s.id]();
  }
  var VISTAS = { inicio: function () { vInicio(); }, ventas: function () { vVentas(); }, cajas: function () { vCajas(); }, diario: function () { vDiario(); }, gastos: function () { vGastos(); }, horas: function () { vHoras(); }, activos: function () { vActivos(); }, resultados: function () { vResultados(); }, informes: function () { vInformes(); }, precios: function () { vPrecios(); }, usuarios: function () { vUsuarios(); } };
  function fallaVista(e) { if (!$('vista')) return; $('vista').innerHTML = '<p class="error">' + esc(e.red ? 'Sin conexión: esta pantalla no se alcanzó a cargar en este celular antes de perder la señal.' : e.message) + '</p>'; }
  function kpi(t, v, s, clase) { return '<div class="kpi ' + (clase || '') + '"><span>' + t + '</span><b class="num">' + v + '</b>' + (s ? '<small>' + s + '</small>' : '') + '</div>'; }
  function cuenta(sec, n) { var e = document.querySelector('[data-cuenta="' + sec + '"]'); if (e) { e.textContent = n; e.style.display = n ? '' : 'none'; } }
  function barras(datos, clave, etiqueta, destacado) {
    var max = Math.max.apply(null, datos.map(function (d) { return d[clave]; }).concat([1]));
    return '<div class="barras">' + datos.map(function (d) {
      return '<div class="b ' + (destacado && destacado(d) ? 'hoy' : '') + '" title="' + esc(etiqueta(d)) + ': ' + esc(d.titulo || '') + '"><small>' + esc(d.corto || '') + '</small><i style="height:' + Math.max(1, Math.round(d[clave] / max * 100)) + '%"></i><em>' + esc(etiqueta(d)) + '</em></div>';
    }).join('') + '</div>';
  }
  function fechaLarga(iso) { var p = String(iso).split('-'); return Number(p[2]) + ' ' + ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][Number(p[1]) - 1]; }
  function corto(n) { n = Number(n || 0); if (Math.abs(n) >= 1e6) return (Math.round(n / 1e5) / 10).toLocaleString('es-CO') + 'M'; if (Math.abs(n) >= 1e3) return Math.round(n / 1e3) + 'k'; return String(Math.round(n)); }

  // ---------- Efectivo que debe haber ----------
  /**
   * Detalle de una cuenta: 'efectivo' (lo guardado + la caja abierta), 'transferencias' (Nequi, Bancolombia...)
   * o 'propinas' (lo de los operadores, guardado aparte). Las dos primeras son plata del negocio, sin propinas.
   * l = liquidez del servidor; un servidor viejo solo manda el efectivo y entonces no hay pestañas.
   */
  function verCuenta(cual, l) {
    var admin = SES.rol === 'ADMIN', tr = cual === 'transferencias', pr = cual === 'propinas';
    var e = pr ? l.propinas : tr ? l.transferencias : l.efectivo;
    var fila = function (t, v, clase) { return '<div class="l' + (clase ? ' ' + clase : '') + '"><span>' + t + '</span><span class="num">' + v + '</span></div>'; };
    var menos = function (t, v) { return v ? fila(t, '−' + pesos(v)) : ''; }, mas = function (t, v) { return v ? fila(t, pesos(v)) : ''; };
    var cuadre = pr ?
      fila('Propinas en efectivo', pesos(e.efectivo)) + mas('Más pasadas desde la cuenta', e.desdeCuenta) + mas('Más efectivo pasado a propinas', e.desdeEfectivo) +
      menos('Menos entregadas', e.entregadas) + fila('En la bolsa', pesos(e.bolsa)) + (e.enCaja ? '<div class="l"><span class="gris">De eso, en la caja abierta</span><span class="num gris">' + pesos(e.enCaja) + '</span></div>' : '') +
      (e.enCuenta ? fila('Todavía en la cuenta de transferencias', pesos(e.enCuenta)) : '') + fila('Propinas por entregar', pesos(e.total), 'total') :
      tr ?
      fila('Ventas por transferencia', pesos(e.ventas)) + mas('Más consignado desde el efectivo', e.consignado) + mas('Más ingresos a la cuenta', e.entradas) +
      menos('Menos pagos y gastos pagados por transferencia', e.pagos) + menos('Menos salidas registradas', e.salidas) + fila('Plata del negocio en la cuenta', pesos(e.total), 'total') +
      (e.propinasEnCuenta ? '<div class="l"><span class="gris">Más propinas que siguen en la cuenta</span><span class="num gris">' + pesos(e.propinasEnCuenta) + '</span></div>' + fila('Lo que debe decir el banco', pesos(e.enBanco)) : '') :
      fila('Contado en los cierres', pesos(e.contado)) + fila('Menos bases sacadas para abrir caja', '−' + pesos(e.bases)) +
      (e.propinasCaja != null ? menos('Menos propinas separadas en los cierres', e.propinas) : '') +
      mas('Más ingresos de efectivo', e.entradas) + mas('Más retiros de la cuenta a efectivo', e.retiros) +
      menos('Menos pagos y gastos pagados con efectivo guardado', e.pagos) + menos('Menos salidas registradas', e.salidas) +
      fila('Guardado fuera de caja', pesos(e.guardado)) + (e.caja ? fila('En la caja abierta' + (e.propinasCaja ? ' (sin propinas)' : ''), pesos(e.caja)) : '') + fila('Total que debe haber', pesos(e.total), 'total');
    var nota = pr ? 'Las propinas no son del negocio: no cuentan en Efectivo, Transferencias ni Liquidez. Las de efectivo se separan al cerrar la caja. Las que llegan por transferencia, cuando las saques a la bolsa, regístralo en Transferencias como "Propinas a la bolsa". Cuando se las entregues a los operadores, regístralo aquí.' :
      tr ? 'Las ventas por transferencia entran solas. Los pagos a proveedores y gastos fijos marcados "Pagado con: Transferencia" se descuentan solos. Registra aquí lo demás: retiros a efectivo, propinas que pasas a la bolsa, pagos a Miguel, repartos.' :
      'Los gastos pagados con plata de la caja ya están descontados en cada cierre, y los pagos marcados "Pagado con: Efectivo guardado" se descuentan solos. Las propinas se separan en la bolsa. Registra aquí lo demás: consignaciones, pagos a Miguel, repartos, o "Pasar a propinas" si una propina quedó como sobrante.';
    var titulo = pr ? 'Propinas guardadas' : tr ? 'Plata en transferencias' : 'Efectivo que debe haber';
    var m = modal(titulo,
      (l.transferencias ? '<div class="pestanas" id="eCta"><button data-c="efectivo" class="' + (!tr && !pr ? 'activo' : '') + '">Efectivo</button><button data-c="transferencias" class="' + (tr ? 'activo' : '') + '">Transferencias</button>' +
        (l.propinas ? '<button data-c="propinas" class="' + (pr ? 'activo' : '') + '">Propinas</button>' : '') + '</div>' : '') +
      '<div class="cuadre">' + cuadre + '</div>' +
      (l.transferencias && !pr ? '<p class="gris peq">Liquidez del negocio (efectivo + transferencias, sin propinas): <b>' + pesos(l.total) + '</b>.</p>' : '') +
      (!l.propinas && e.propinas ? '<p class="gris peq">De ese total, ' + pesos(e.propinas) + ' son propinas de los operadores.</p>' : '') +
      (l.nSinIndicar && !pr ? '<p class="gris peq">Hay ' + l.nSinIndicar + ' pago(s) o gasto(s) por ' + pesos(l.sinIndicar) + ' sin decir con qué se pagaron: no se descuentan de ninguna cuenta. Complétalos en Gastos.</p>' : '') +
      '<p class="gris peq">' + nota + '</p>' +
      (e.movimientos.length ? '<h3>Últimos movimientos</h3><div class="lista">' + e.movimientos.map(function (x) {
        // Un mismo movimiento se ve en dos cuentas (una consignación sale del efectivo y entra a transferencias): signo según esta cuenta.
        var aqui = pr ? (x.motivo === 'Propinas entregadas' ? 'sale' : 'entra') :
          (x.cuenta === (tr ? 'TRANSFERENCIA' : 'EFECTIVO')) ? (x.tipo === 'SALIDA' ? 'sale' : 'entra') : 'entra';
        return '<div class="item"><div class="d"><b>' + esc(x.motivo) + '</b><span>' + fechaCorta(x.fecha).slice(0, 5) + ' ' + esc(x.hora) + ' · ' + esc(x.usuario) + (x.descripcion ? ' · ' + esc(x.descripcion) : '') + '</span></div><div class="v ' + (aqui === 'sale' ? 'neg' : 'pos') + '">' + (aqui === 'sale' ? '−' : '+') + pesos(x.valor) + '</div></div>';
      }).join('') + '</div>' : '') +
      (admin ? '<h3>' + (pr ? 'Entregar propinas' : 'Registrar movimiento') + '</h3>' +
        (pr ? '' : '<div class="medios" id="eTipo"><button data-t="SALIDA" class="sel">' + (tr ? 'Sale de la cuenta' : 'Sale efectivo') + '</button><button data-t="ENTRADA">' + (tr ? 'Entra a la cuenta' : 'Entra efectivo') + '</button></div>') +
        '<label>Motivo</label><select id="eMot">' + e.motivos.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
        '<div class="grid2"><div><label>Valor</label><input id="eVal" inputmode="numeric"></div><div><label>Detalle</label><input id="eDes" placeholder="' + (pr ? 'A quién' : 'Opcional') + '"></div></div>' +
        '<div class="acciones"><button id="eGuardar">Registrar</button></div>' : ''));
    $$('#eCta button', m).forEach(function (b) { b.onclick = function () { if (b.getAttribute('data-c') === cual) return; m.cerrar(); verCuenta(b.getAttribute('data-c'), l); }; });
    if (!admin) return;
    var tipo = 'SALIDA';
    campoPesos(m.querySelector('#eVal'));
    $$('#eTipo button', m).forEach(function (b) { b.onclick = function () { tipo = b.getAttribute('data-t'); $$('#eTipo button', m).forEach(function (y) { y.classList.toggle('sel', y === b); }); m.querySelector('#eMot').value = tipo === 'ENTRADA' ? (tr ? 'Ingreso a la cuenta' : 'Ingreso de efectivo') : (tr ? 'Retiro a efectivo' : 'Consignación al banco'); }; });
    m.querySelector('#eGuardar').onclick = function () {
      var x = { cuenta: pr ? 'PROPINAS' : tr ? 'TRANSFERENCIA' : 'EFECTIVO', tipo: tipo, motivo: m.querySelector('#eMot').value, descripcion: m.querySelector('#eDes').value.trim(), valor: numeroDe(m.querySelector('#eVal').value) };
      if (!(x.valor > 0)) { aviso('Escribe el valor', 'error'); return; }
      api('adminMovimientoEfectivo', x).then(function () { m.cerrar(); aviso('Movimiento registrado', 'exito'); vInicio(); }).catch(function (er) { aviso(er.message, 'error'); });
    };
  }

  // ---------- Inicio ----------
  function vInicio() {
    api('adminInicio').then(function (r) {
      var d = r.dia || { vasos: 0, ingreso: 0, efectivo: 0, transferencia: 0, margen: 0 };
      var liq = r.liquidez || null, lq = liq || { efectivo: r.efectivo };
      var m = r.mes || {};
      var eq = r.equilibrio || {};
      // La barra mide solo lo vendido hoy: arranca en cero cada día.
      // Meta de hoy = lo que falta para la meta del mes, repartido entre los días que quedan (hoy incluido).
      // Lo que faltó en días anteriores sube un poco la meta de cada día restante; lo que sobró la baja.
      var vHoy = (d && d.vasos) || 0, base = eq.vasosDia || 0;
      var diasAntes = Math.max(0, (r.diasTrabajados || 0) - (vHoy > 0 ? 1 : 0)), vasosAntes = Math.max(0, ((r.mes && r.mes.vasos) || 0) - vHoy);
      var pHoy = r.hoy.split('-').map(Number), ultimoDia = new Date(Date.UTC(pHoy[0], pHoy[1], 0)).getUTCDate(), diasQuedan = ultimoDia - pHoy[2] + 1;
      // Solo cuentan los días que se abre (sin el día de descanso de cada semana). Un servidor viejo no manda diasQuedanMes: se usa el mes calendario.
      if (r.diasQuedanMes != null) diasQuedan = r.diasQuedanMes;
      // Con una cuota del préstamo por vencer, la meta se mide del 16 al 15 (período de la deuda), no en el mes calendario.
      var pd = r.periodoDeuda;
      if (pd) { diasAntes = pd.diasAntes; vasosAntes = pd.vasosAntes; diasQuedan = pd.dias - pd.diasAntes; }
      // En el período de la deuda la meta total son los vasos que pide la hoja para ese mes; si no, base × días abiertos.
      var metaMes = Math.round(pd && eq.vasosMes ? eq.vasosMes : base * (diasAntes + diasQuedan));
      // Nunca baja de la meta base: lo vendido de más queda como ganancia o adelanta la deuda (Samuel, 17 oct 2026).
      var meta = base ? Math.max(Math.round(base), Math.ceil((metaMes - vasosAntes) / Math.max(1, diasQuedan))) : 0, arrastre = meta - Math.round(base);
      var cerradoHoy = r.hoyAbierto === false && !vHoy;
      var avance = meta ? Math.min(100, vHoy / meta * 100) : 0;
      var horas = Object.keys(r.porHora).sort().map(function (h) { return { h: h, v: r.porHora[h], corto: r.porHora[h] }; });
      cuenta('cajas', r.alertas.filter(function (a) { return a.tipo === 'cierre' || a.tipo === 'turno'; }).length);
      $('vista').innerHTML =
        '<div class="kpis">' +
        kpi('Hoy · vendido', pesos(d.ingreso), d.vasos + ' vasos · ' + r.ventasHoy + ' ventas', 'destacado') +
        kpi('Hoy · efectivo', pesos(d.efectivo), 'Transferencias ' + pesos(d.transferencia)) +

        kpi('Ingresos', pesos(m.ingresos), (m.vasos || 0) + ' vasos') + kpi('Insumos pagados', pesos(m.costoInsumos), m.costoReceta != null ? 'Según receta ' + pesos(m.costoReceta) : '') + kpi('Gastos fijos', pesos(m.gastos)) +
        kpi('Utilidad neta', pesos(m.utilidadNeta), 'Según Resumen Mensual', m.utilidadNeta < 0 ? 'negativo' : '') +
        kpi('Caja acumulada', pesos(m.cajaAcumulada), 'Flujo de Caja', m.cajaAcumulada < 0 ? 'negativo' : '') + '</div></div>' +
        '</div><div>' +
        '<div class="tarjeta"><h2>Punto de equilibrio</h2><p class="gris peq" style="margin-top:-6px">' + (pd ? 'Incluye costos fijos y ' + (pd.cuotas > 1 ? 'la cuota ' + pd.cuota + ' de ' + pd.cuotas : 'el pago completo') + ' del préstamo de Miguel, que vence el ' + fechaLarga(pd.pago) + '. Se mide del ' + fechaLarga(pd.desde) + ' al ' + fechaLarga(pd.hasta) + '.' : r.equilibrioConPrestamo ? 'Incluye costos fijos y el pago completo del préstamo de Miguel' + (r.primerCuotaMes && r.primerCuotaMes > r.hoy.slice(0, 7) ? ' (se paga en ' + nombreMes(r.primerCuotaMes) + ')' : '') + '.' : 'Costos fijos promedio, sin préstamo.') + '</p>' +
        '<div class="fila"><div><div class="gris peq">' + (cerradoHoy ? 'Hoy no se abre · meta del próximo día' : 'Meta de hoy') + '</div><b style="font-size:24px">' + meta + ' vasos</b>' + (diasAntes && arrastre > 0 ? '<div class="gris peq">' + Math.round(base) + ' + ' + arrastre + ' por lo que faltó' + '</div>' : '') + '</div><div><div class="gris peq">Vendidos hoy</div><b style="font-size:24px">' + vHoy + '</b></div></div>' +
        '<div class="progreso ' + (avance < 100 ? 'bajo' : '') + '"><i style="width:' + avance + '%"></i></div><div class="gris peq">' + (meta ? (vHoy >= meta ? 'Meta de hoy cumplida' + (vHoy > meta ? ' (+' + (vHoy - meta) + ')' : '') : Math.round(avance) + '% · faltan ' + (meta - vHoy) + ' vasos') : 'Se calcula cuando haya gastos fijos registrados.') + '</div>' +
        (base ? '<div class="gris peq" style="margin-top:6px">' + (pd ? 'Meta para la cuota del ' + fechaLarga(pd.pago) : 'Meta del mes') + ': <b>' + metaMes.toLocaleString('es-CO') + ' vasos</b> · llevan ' + (vasosAntes + vHoy).toLocaleString('es-CO') + ' · quedan ' + diasQuedan + ' día' + (diasQuedan === 1 ? '' : 's') + ' abierto' + (diasQuedan === 1 ? '' : 's') + ' (sin descansos)</div>' : '') +
        (r.diasTrabajados ? '<div class="gris peq">Promedio del mes: <b>' + Math.round(r.promedioVasosDia) + ' vasos/día</b> en ' + r.diasTrabajados + ' día' + (r.diasTrabajados === 1 ? '' : 's') + '</div>' : '') + '</div>' +
        tarjetaDescanso(r.descanso) +

        '<div class="tarjeta" style="margin-top:16px"><h2>Vasos por hora · hoy</h2>' + (horas.length ? barras(horas, 'v', function (x) { return x.h + 'h'; }) : '<div class="vacio">Sin ventas hoy.</div>') + '</div>' +

              .then(function () { aviso('Nómina registrada', 'exito'); vInicio(); }).catch(function (e) { aviso(e.message, 'error'); });
          });

  /*
   * Día de descanso (Samuel, 26 oct 2026): cambia cada semana, el día que menos se vende. Se escoge aquí la de esta semana
   * y la de la próxima; la app sugiere el día con menos vasos en promedio de las últimas 4 semanas.
   */
  var DIAS_SEMANA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  function tarjetaDescanso(ds) {
    if (!ds) return '';
    var orden = [1, 2, 3, 4, 5, 6, 0];
    var rango = function (lunes) { return fechaCorta(lunes).slice(0, 5) + ' al ' + fechaCorta(sumarDias(lunes, 6)).slice(0, 5); };
    var nombre = function (d) { return d < 0 ? 'ninguno, se abre todos los días' : DIAS_SEMANA[d]; };
    var editable = SES.rol === 'ADMIN';
    var fila = function (titulo, lunes, dia) {
      return '<div class="fila" style="align-items:center;margin-top:8px"><div><div class="gris peq">' + titulo + ' · ' + rango(lunes) + '</div>' +
        (editable ? '<select data-descanso="' + lunes + '" aria-label="Día de descanso ' + titulo.toLowerCase() + '" style="margin-top:4px">' +
          orden.concat([-1]).map(function (d) { return '<option value="' + d + '"' + (d === dia ? ' selected' : '') + '>' + (d < 0 ? 'Sin descanso' : DIAS_SEMANA[d].charAt(0).toUpperCase() + DIAS_SEMANA[d].slice(1)) + (d === ds.sugerido ? ' (sugerido)' : '') + '</option>'; }).join('') + '</select>'
          : '<b>' + esc(nombre(dia)) + '</b>') + '</div></div>';
    };
    var proms = orden.map(function (d) { var p = ds.promedios[d]; return '<span' + (d === ds.sugerido ? ' style="font-weight:700"' : '') + '>' + DIAS_SEMANA[d].slice(0, 3) + ' ' + (p.promedio === null ? '—' : p.promedio) + '</span>'; }).join(' · ');
    return '<div class="tarjeta" style="margin-top:16px"><h2>Día de descanso</h2>' +
      '<p class="gris peq" style="margin-top:-6px">Ese día no cuenta para la meta diaria ni para las faltas. ' +
      (ds.sugerido !== null ? 'Sugerido: <b>' + DIAS_SEMANA[ds.sugerido] + '</b>, el día que menos vende.' : 'Todavía no hay ventas para sugerir un día.') + '</p>' +
      fila('Esta semana', ds.semana, ds.dia) + fila('Próxima semana', ds.siguiente, ds.diaSiguiente) +
      '<div class="gris peq" style="margin-top:10px">Vasos promedio por día, últimas 4 semanas: ' + proms + '</div></div>';
  }

  // ---------- Ventas ----------

      '<div><label>Medio</label><select id="fMedio"><option value="">Todos</option><option value="EFECTIVO"' + (f.medio === 'EFECTIVO' ? ' selected' : '') + '>Efectivo</option><option value="TRANSFERENCIA"' + (f.medio === 'TRANSFERENCIA' ? ' selected' : '') + '>Transferencia</option></select></div>' +

      '<div style="flex:0 0 auto"><button id="fBuscar">Buscar</button></div></div><div id="vRes">' + cargando() + '</div>';
    var buscar = function () {
      AD.fVentas = { desde: $('fDesde').value, hasta: $('fHasta').value, usuario: $('fUsuario').value, medio: $('fMedio').value, estado: $('fEstado').value, texto: $('fTexto').value.trim() };
      api('adminVentas', AD.fVentas).then(function (r) {

          (r.ventas.length ? '<div class="tabla-scroll"><table><thead><tr><th>Fecha</th><th>Detalle</th><th>Vendedor</th><th>Medio</th><th class="n">Total</th><th></th></tr></thead><tbody>' + r.ventas.map(function (v) {
            return '<tr class="' + (v.estado !== 'ACTIVA' ? 'anulada' : '') + '"><td class="num">' + fechaCorta(v.fecha) + ' ' + esc(v.hora) + '</td><td>' + esc(v.detalle) + (v.nota ? '<div class="gris peq">' + esc(v.nota) + '</div>' : '') + (v.estado !== 'ACTIVA' ? '<div class="peq">Anulada por ' + esc(v.anuladoPor) + ': ' + esc(v.motivoAnulacion) + '</div>' : '') + '</td>' +
              '<td>' + esc(v.vendedor) + '</td><td>' + (v.medio === 'EFECTIVO' ? '<span class="chip">Efectivo</span>' : '<span class="chip azul">' + esc(v.canal || 'Transf.') + '</span>') + '</td><td class="n">' + pesos(v.total) + (v.propina ? '<div class="gris peq">+ propina ' + pesos(v.propina) + '</div>' : '') + '</td>' +

          }).join('') + '</tbody></table></div>' + (r.recortado ? '<p class="gris peq">Se muestran las 800 más recientes; acote el rango para ver el resto.</p>' : '') : '<div class="vacio">No hay ventas con esos filtros.</div>');
        $$('[data-anular]').forEach(function (b) {

  // ---------- Cierres de caja ----------
  function vCajas() {

          '<td class="n">' + t.ventasN + '<div class="gris peq">' + t.vasos + ' vasos</div></td><td class="n">' + pesos(t.total) + '</td><td class="n">' + pesos(t.esperado) + '</td><td class="n">' + (t.contado === null ? '—' : pesos(t.contado)) + '</td>' +

      }).join('') + '</tbody></table></div>' : '<div class="vacio">No hay cajas con ese filtro.</div>';
      $$('[data-t]').forEach(function (tr) { tr.onclick = function () { detalleTurno(tr.getAttribute('data-t')); }; });
    }).catch(fallaVista);

  function chipTurno(e) { return { ABIERTO: '<span class="chip amarillo">Abierta</span>', CERRADO: '<span class="chip azul">Por revisar</span>', REVISADO: '<span class="chip">Revisada</span>' }[e] || esc(e); }

  function detalleTurno(id) {

        kpi('Contado', t.contado === null ? '—' : pesos(t.contado), t.cierra ? 'Cerró ' + esc(t.cierra) : '') + kpi('Diferencia', t.estado === 'ABIERTO' ? '—' : pesos(t.diferencia), '', t.diferencia < 0 ? 'negativo' : '') + kpi('Transferencias', pesos(t.transferencia)) + kpi('Propinas', pesos(t.propinas || 0), 'Efectivo ' + pesos(t.propinasEfectivo || 0) + ' · Transf. ' + pesos(t.propinasTransferencia || 0)) + '</div>' +
        (t.obs ? '<div class="tarjeta" style="margin:12px 0"><h3 style="margin:0 0 4px">Observaciones del cierre</h3><p style="margin:0">' + esc(t.obs) + '</p><div class="gris peq">' + esc(t.cierra || '') + '</div></div>' : '') +

          return '<tr class="' + (v.estado !== 'ACTIVA' ? 'anulada' : '') + '"><td>' + esc(v.hora) + '</td><td>' + esc(v.detalle) + (v.nota ? '<div class="gris peq">Nota: ' + esc(v.nota) + '</div>' : '') + '</td><td>' + esc(v.vendedor) + '</td><td>' + (v.medio === 'EFECTIVO' ? 'Efectivo' : esc(v.canal || 'Transf.')) + '</td><td class="n">' + pesos(v.total) + (v.propina ? '<div class="gris peq">+ propina ' + pesos(v.propina) + '</div>' : '') + '</td></tr>';

      if (m.querySelector('#mRevisar')) m.querySelector('#mRevisar').onclick = function () { api('adminRevisarTurno', id).then(function () { m.cerrar(); aviso('Caja revisada', 'exito'); vCajas(); }).catch(function (e) { aviso(e.message, 'error'); }); };

  // ---------- Reporte diario ----------
  function vDiario() {

  function horaTurno(h) { var n = Number(String(h || '').slice(0, 2)); return n >= 24 ? ('0' + (n - 24)).slice(-2) + String(h).slice(2) + ' (+1)' : String(h || ''); }

    var ult = new Date(Date.UTC(p[0], p[1], 0)).getUTCDate();
    return { desde: iso.slice(0, 8) + (primera ? '01' : '16'), hasta: iso.slice(0, 8) + (primera ? '15' : String(ult)) };
  }

      '<div class="peq"><b>Extra:</b> ' + horasMin(d.diurna + d.nocturna) + ' = ' + pesos(d.valor) + (d.estado === 'aprobada' ? ' · aprobada por ' + esc(d.aprobadoPor) : '') + '</div>' +

  function formLicencia(emp, i, l) {

  function formGasto(tab, x) {
    var pagos = tab === 'pagos';
    x = x || { fecha: AD.hoy, categoria: '', descripcion: '', valor: '', proveedor: '', estado: 'Pagado' };
    var cats = pagos ? AD.cat.categoriasPago : AD.cat.categoriasGasto;
    // "Pagado con" decide de qué cuenta se descuenta (Samuel, 22 oct 2026). Lo del capital de Miguel se registra en Activos.
    // Un servidor viejo no conoce "Pagado con" (no manda la lista): no se pregunta, para no prometer algo que no se guarda.
    var opcionesCon = AD.cat.pagadoCon || null;
    var deCaja = x.pagadoCon === 'Caja del día', pagadoCon = x.pagadoCon || '';
    var m = modal((x.fila ? 'Editar ' : 'Registrar ') + (pagos ? 'pago a proveedor' : 'gasto fijo'),
      '<div class="grid2"><div><label>Fecha</label><input type="date" id="xF" value="' + esc(x.fecha) + '"></div><div><label>Valor</label><input id="xV" value="' + esc(x.valor) + '"></div></div>' +
      (pagos ? '<label>Proveedor</label><input id="xP" value="' + esc(x.proveedor) + '">' : '') +
      '<label>Categoría</label><select id="xC">' + cats.map(function (c) { return '<option' + (c === x.categoria ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
      '<label>Descripción</label><input id="xD" value="' + esc(x.descripcion) + '">' +
      (pagos ? '<label>Estado</label><div class="medios" id="xE"><button data-e="Pagado" class="' + (x.estado !== 'Pendiente' ? 'sel' : '') + '">Pagado</button><button data-e="Pendiente" class="' + (x.estado === 'Pendiente' ? 'sel' : '') + '">Pendiente</button></div>' : '') +
      (!opcionesCon ? '' : deCaja ? '<label>Pagado con</label><p class="gris peq" style="margin:4px 0 0">Caja del día: se pagó con la plata de la caja abierta y ya está descontado en el cierre.</p>' :
        '<div id="xConBox"><label>Pagado con</label><div class="medios" id="xCon">' + opcionesCon.map(function (c) { return '<button data-con="' + esc(c) + '" class="' + (c === pagadoCon ? 'sel' : '') + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
        '<p class="gris peq" id="xConNota" style="margin:4px 0 0"></p></div>') +
      '<div class="acciones">' + (x.fila ? '<button class="peligro" id="xB">Borrar</button>' : '') + '<button id="xG">Guardar</button></div>');
    campoPesos(m.querySelector('#xV'));
    var estado = x.estado || 'Pagado';
    var notaCon = function () {
      var n = m.querySelector('#xConNota'), box = m.querySelector('#xConBox');
      if (box) box.style.display = estado === 'Pendiente' ? 'none' : '';
      if (n) n.textContent = { 'Efectivo guardado': 'Se descuenta del efectivo guardado.', 'Transferencia': 'Se descuenta de la plata en transferencias.', 'Capital de Miguel': 'No es gasto del negocio: se registra en Activos y se descuenta del capital de Miguel.' }[pagadoCon] || 'Elige de dónde salió la plata.';
    };
    $$('#xE button', m).forEach(function (b) { b.onclick = function () { estado = b.getAttribute('data-e'); $$('#xE button', m).forEach(function (y) { y.classList.toggle('sel', y === b); }); notaCon(); }; });
    $$('#xCon button', m).forEach(function (b) { b.onclick = function () { pagadoCon = b.getAttribute('data-con'); $$('#xCon button', m).forEach(function (y) { y.classList.toggle('sel', y === b); }); notaCon(); }; });
    notaCon();
    m.querySelector('#xG').onclick = function () {
      var d = { fila: x.fila || null, fecha: m.querySelector('#xF').value, categoria: m.querySelector('#xC').value, descripcion: m.querySelector('#xD').value.trim(), valor: numeroDe(m.querySelector('#xV').value) };
      if (pagos) { d.proveedor = m.querySelector('#xP').value.trim(); d.estado = estado; }
      if (!opcionesCon) { /* servidor viejo */ }
      else if (deCaja) d.pagadoCon = 'Caja del día';
      else if (estado === 'Pendiente') d.pagadoCon = '';
      else if (!pagadoCon) { aviso('Elige con qué se pagó', 'error'); return; }
      else d.pagadoCon = pagadoCon;
      api(pagos ? 'adminGuardarPago' : 'adminGuardarGasto', d).then(function (r) { m.cerrar(); aviso(r && r.activo ? 'Registrado en Activos (capital de Miguel)' : 'Guardado en el archivo', 'exito'); vGastos(); }).catch(function (e) { aviso(e.message, 'error'); });
    };
    if (m.querySelector('#xB')) m.querySelector('#xB').onclick = function () {
      confirmar('Borrar', '¿Borrar este registro del archivo?', 'Borrar', true).then(function (s) { if (!s) return; api(pagos ? 'adminBorrarPago' : 'adminBorrarGasto', x.fila).then(function () { m.cerrar(); aviso('Borrado', 'exito'); vGastos(); }).catch(function (e) { aviso(e.message, 'error'); }); });
    };
  }
