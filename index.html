  /* ================= Capa estilo Apple (respuesta, materiales, tipografía, movimiento) ================= */
  :root { --resorte: cubic-bezier(.32,.72,0,1); --vidrio: rgba(255,255,255,.72); --vidrio-borde: rgba(255,255,255,.5); }
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  button, a, .prod, .tamano, .item, .kpi, .alerta, tr.clic, .carrito .caja, .menu nav a { touch-action: manipulation; }
  /* Respuesta inmediata al presionar (no al soltar) */
  button, .tamano, .medios button, .billetes button, .opciones button, .pestanas button, .carrito .caja, .menu nav a, .alerta { transition: transform 100ms ease-out, background-color .15s, border-color .15s, color .15s, opacity .15s; }
  button:active:not(:disabled), .carrito .caja:active, .menu nav a:active, .alerta:active { transform: scale(.97); }
  .prod { transition: transform 100ms ease-out, border-color .12s; }
  .prod:active, .item:active { transform: scale(.98); }
  .item { transition: transform 100ms ease-out, background-color .15s; }
  @media (hover: none) { button:hover { filter: none; } }
  /* Áreas táctiles de al menos 44 px */
  button { min-height: 44px; }
  button.link, .login button.aviso-link { min-height: 44px; padding-inline: 6px; }
  .modal header button { width: 44px; height: 44px; border-radius: 50%; }
  .op-barra button.icono { width: 44px; height: 44px; }
  .stepper button { width: 44px; height: 44px; }
  .opciones button, .pestanas button { min-height: 40px; }
  .interruptor button { min-height: 36px; }
  .barra .btn-menu { min-width: 44px; min-height: 44px; }
  .barra .avatar { width: 40px; height: 40px; flex-basis: 40px; }
  /* Tipografía: tracking según tamaño y cifras tabulares */
  h1, .login h1 { letter-spacing: .01em; }
  .total-grande, .kpi b, .dato b, .socio b, .cambio b, .carrito .caja .t b, .op-barra .estado-caja b { letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .prod .precio, .item .v, .tamano span, .stepper span, .cuadre .l, .linea-carrito .v { font-variant-numeric: tabular-nums; }
  .kpi span, .dato span, th { letter-spacing: .05em; font-size: 11.5px; }
  .gris, .peq { letter-spacing: .005em; }
  h2, .encabezado-seccion h2 { text-wrap: balance; }
  /* Materiales translúcidos con borde de luz y desvanecido al borde en vez de línea dura */
  .barra { background: var(--vidrio); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-bottom: none; box-shadow: 0 1px 0 rgba(10,40,20,.06), 0 8px 16px -12px rgba(10,40,20,.25); }
  .nav-op { background: var(--vidrio); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-top: 1px solid var(--vidrio-borde); box-shadow: 0 -1px 0 rgba(10,40,20,.06); height: calc(64px + env(safe-area-inset-bottom)); }
  .nav-op button { min-height: 0; }
  .nav-op button svg { transition: transform .2s var(--resorte); }
  .nav-op button.activo svg { transform: translateY(-1px) scale(1.06); }
  .carrito { bottom: calc(64px + env(safe-area-inset-bottom)); }
  .carrito .caja { background: rgba(14,74,29,.92); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; }
  .op-barra { box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 10px 20px -14px rgba(0,0,0,.5); }
  /* Tarjetas y listas con radios continuos y sombras suaves */
  :root { --radio: 16px; --sombra: 0 0 0 .5px rgba(10,40,20,.06), 0 1px 2px rgba(10,40,20,.05), 0 4px 14px rgba(10,40,20,.06); }
  .prod { border-radius: 20px; }
  input, select, textarea { border-radius: 12px; min-height: 44px; transition: border-color .15s, box-shadow .15s; }
  button { border-radius: 12px; }
  button.grande { border-radius: 16px; min-height: 52px; }
  .login { border-radius: 26px; }
  /* Aviso: entra y sale por el mismo camino (desde abajo) */
  #aviso { transition: transform .4s var(--resorte), opacity .25s ease; background: rgba(21,41,26,.9); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-radius: 14px; bottom: calc(24px + env(safe-area-inset-bottom)); }
  #aviso:not(.visible) { opacity: 0; transform: translate(-50%, 140%); }
  body.con-nav #aviso { bottom: calc(150px + env(safe-area-inset-bottom)); }
  /* Hoja/modal: velo que oscurece, entrada con resorte, salida por el mismo camino */
  .velo-modal { transition: opacity .3s ease; background: rgba(8,30,14,.42); }
  .modal { transition: transform .45s var(--resorte), opacity .3s ease; transform: translateY(12px) scale(.98); opacity: 0; border-radius: 22px; }
  .velo-modal.visible .modal { transform: none; opacity: 1; }
  .modal .agarre { display: none; }
  @media (max-width: 640px) {
    .modal { transform: translateY(100%); opacity: 1; border-radius: 24px 24px 0 0; touch-action: pan-y; }
    .velo-modal.visible .modal { transform: translateY(0); }
    .modal.arrastrando { transition: none; }

    .modal .agarre::before { content: ''; display: block; width: 38px; height: 5px; border-radius: 3px; background: #c9d3cb; margin: 0 auto; }
    .modal header { padding-top: 4px; touch-action: none; }
  }
  /* Menú lateral con resorte y el mismo camino de ida y vuelta */
  @media (max-width: 900px) { .menu { transition: transform .45s var(--resorte); } .velo.visible { background: rgba(0,0,0,.32); } }
  /* ================= Liquid Glass: vidrio con refracción de luz, brillo en el borde y profundidad ================= */
  :root {
    --lg-fondo: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.38));
    --lg-filtro: blur(22px) saturate(190%) brightness(1.06);
    --lg-brillo: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35), inset 1px 0 0 rgba(255,255,255,.4), inset -1px 0 0 rgba(255,255,255,.4), inset 0 0 18px rgba(255,255,255,.25);
    --lg-sombra: 0 10px 30px -6px rgba(10,40,20,.28), 0 2px 6px rgba(10,40,20,.08);
  }
  .nav-op, .modal, #aviso, .login { isolation: isolate; } .carrito .caja { position: relative; isolation: isolate; } .modal { position: relative; }
  /* Reflejo especular: una capa de luz que cae desde arriba sobre cada superficie de vidrio */
  .nav-op::before, .carrito .caja::before, .modal::before, #aviso::before, .login::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: radial-gradient(120% 70% at 30% -10%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%), radial-gradient(80% 60% at 100% 120%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%);
  }
  /* Barra de pestañas flotante tipo cápsula */
  .nav-op { left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); height: 66px; padding: 5px; gap: 2px; border-radius: 33px; max-width: 520px; margin: 0 auto;
    background: var(--lg-fondo); -webkit-backdrop-filter: var(--lg-filtro); backdrop-filter: var(--lg-filtro); border: 1px solid rgba(255,255,255,.55); box-shadow: var(--lg-brillo), var(--lg-sombra); }
  .nav-op button { border-radius: 28px; position: relative; transition: transform 100ms ease-out, color .2s, background-color .25s var(--resorte), box-shadow .25s; }
  .nav-op button.activo { background: rgba(255,255,255,.7); box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(26,128,53,.10), 0 2px 8px rgba(10,40,20,.12); }
  .carrito { bottom: calc(84px + env(safe-area-inset-bottom)); }
  .op { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
  body.con-nav #aviso { bottom: calc(172px + env(safe-area-inset-bottom)); }
  /* Carrito: vidrio teñido de verde de la marca */
  .carrito .caja { background: linear-gradient(180deg, rgba(30,140,58,.78), rgba(14,74,29,.84)); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,.28); border-radius: 26px;

  .carrito .caja::before { background: radial-gradient(110% 80% at 25% -20%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%); }
  .carrito button.amarillo { border-radius: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 4px 12px rgba(0,0,0,.2); }
  /* Encabezado del panel */
  .barra { background: var(--lg-fondo); -webkit-backdrop-filter: var(--lg-filtro); backdrop-filter: var(--lg-filtro); box-shadow: inset 0 -1px 0 rgba(255,255,255,.7), 0 1px 0 rgba(10,40,20,.06), 0 10px 20px -16px rgba(10,40,20,.35); }
  /* Botones de vidrio sobre la barra verde */
  .op-barra button.icono { background: rgba(255,255,255,.16); border: none; border-radius: 12px; color: #fff; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; filter: none; }
  .op-barra button.icono svg { width: 22px; height: 22px; min-width: 22px; flex: none; display: block; stroke: #fff; }
  .modal header button { background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(235,242,236,.6)); border: 1px solid rgba(255,255,255,.8); box-shadow: inset 0 1px 0 #fff, 0 2px 8px rgba(10,40,20,.12); }
  /* Hoja y ventanas: vidrio más grueso (más desenfoque y más sombra porque es una superficie grande) */
  .modal { background: linear-gradient(180deg, rgba(255,255,255,.90), rgba(250,253,250,.84)); -webkit-backdrop-filter: blur(34px) saturate(200%); backdrop-filter: blur(34px) saturate(200%); border: 1px solid rgba(255,255,255,.7); box-shadow: inset 0 1px 0 #fff, 0 30px 70px -10px rgba(0,20,8,.45); }
  .velo-modal { background: rgba(8,30,14,.32); }
  .modal::before { background: radial-gradient(100% 40% at 50% -5%, rgba(255,255,255,.7), rgba(255,255,255,0) 70%); }
  /* Al aparecer, el vidrio se materializa: escala y desenfoque juntos */
  @media (min-width: 641px) { .modal { transform: translateY(10px) scale(.96); filter: blur(4px); transition: transform .45s var(--resorte), opacity .3s ease, filter .3s ease; } .velo-modal.visible .modal { filter: none; } }
  /* Aviso: cápsula de vidrio oscuro */
  #aviso { background: linear-gradient(180deg, rgba(40,62,46,.78), rgba(16,34,21,.86)); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,.18); border-radius: 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 12px 30px -6px rgba(0,0,0,.45); }

  .login { background: linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.74)); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); border: 1px solid rgba(255,255,255,.7); box-shadow: inset 0 1px 0 #fff, 0 24px 60px -10px rgba(0,30,10,.5); }
  .login::before { z-index: 0; } .login > * { position: relative; z-index: 1; }
  .login input { background: rgba(255,255,255,.85); }
  /* Sin soporte de desenfoque: superficies sólidas para que el texto siempre se lea */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .nav-op, .barra, .modal, .login { background: #fff; } .carrito .caja { background: var(--verde-menu); } #aviso { background: #15291a; }
  }
  /* ================= Claymorfismo: tarjetas y botones principales "de plastilina" (volumen suave, luz arriba, sombra de color) ================= */
  :root { --clay-luz: inset 0 2px 1px rgba(255,255,255,.9), inset 0 8px 16px rgba(255,255,255,.55); --clay-fondo: inset 0 -6px 14px rgba(10,40,20,.07); }
  .prod { border-radius: 28px; border: none; background: linear-gradient(180deg, #fff 55%, color-mix(in srgb, var(--c, var(--verde)) 7%, #fff));
    box-shadow: var(--clay-luz), var(--clay-fondo), 0 14px 26px -12px color-mix(in srgb, var(--c, var(--verde)) 55%, transparent), 0 3px 6px rgba(10,40,20,.06); }
  .prod::before { border-radius: 28px 28px 50% 50% / 28px 28px 30px 30px; }
  .prod:active { box-shadow: var(--clay-luz), inset 0 -3px 8px rgba(10,40,20,.08), 0 6px 14px -8px color-mix(in srgb, var(--c, var(--verde)) 55%, transparent); }
  .prod .en-carrito, .prod .mas18, .prod .destacado { box-shadow: inset 0 1px 1px rgba(255,255,255,.7), inset 0 -2px 3px rgba(0,0,0,.12), 0 3px 6px rgba(0,0,0,.15); }
  .tamano { border: none; border-radius: 24px; background: linear-gradient(180deg, #fff, #f3faf4); box-shadow: var(--clay-luz), var(--clay-fondo), 0 10px 20px -10px rgba(26,128,53,.45), 0 0 0 1.5px var(--verde-borde); }
  .tamano:hover { background: linear-gradient(180deg, #fff, var(--verde-claro)); }
  .tamano:active { box-shadow: inset 0 2px 1px rgba(255,255,255,.9), inset 0 -2px 8px rgba(10,40,20,.1), 0 4px 10px -6px rgba(26,128,53,.45), 0 0 0 1.5px var(--verde); }
  .kpi, .dato, .socio, .tarjeta, .cuadre, .lista, .tabla-scroll { border-radius: 22px; box-shadow: var(--clay-luz), var(--clay-fondo), 0 12px 24px -14px rgba(10,40,20,.35), 0 0 0 .5px rgba(10,40,20,.05); }
  .kpi.destacado { box-shadow: inset 0 2px 1px rgba(255,255,255,.35), inset 0 -8px 16px rgba(0,0,0,.18), 0 14px 26px -12px rgba(20,107,43,.7); }
  /* Botones principales en arcilla: brillo arriba, base más oscura y sombra del mismo color */
  button:not(.sec):not(.peligro):not(.link):not(.aviso-link):not(.icono) { border: none; }
  button.grande, .login button#btnIngresar, .acciones button:not(.sec):not(.peligro), button#btnCobrar, button#mConfirmar, button#cCerrar, button#gGuardar {

  /* ================= Neumorfismo: controles que salen del mismo material del fondo (relieve) y se hunden al elegirlos ================= */
  :root { --neu-bg: #eef3ee; --neu-osc: rgba(150,170,155,.55); --neu-luz: rgba(255,255,255,.95);

  }

<script>
  // ================= Utilidades comunes =================
  var SES = null;
  var $ = function (id) { return document.getElementById(id); };
  var $$ = function (sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pesos(n) { n = Math.round(Number(n || 0)); return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('es-CO'); }
  function numeroDe(s) { return Number(String(s == null ? '' : s).replace(/[^\d-]/g, '')) || 0; }
  function pct(n) { return (Math.round(Number(n || 0) * 1000) / 10).toLocaleString('es-CO') + '%'; }
  function fechaCorta(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  var DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function diaSemana(iso) { var p = iso.split('-').map(Number); return DIAS[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()]; }
  function nombreMes(ym) { var p = ym.split('-'); return MESES[Number(p[1]) - 1] + ' ' + p[0]; }
  function hoyISO(dias) { var d = new Date(Date.now() + (dias || 0) * 864e5 - 5 * 3600e3); return d.toISOString().slice(0, 10); }
  function sumarDias(iso, n) { var p = iso.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2]) + n * 864e5).toISOString().slice(0, 10); }
  function aviso(t, tipo, ms) {
    var a = $('aviso'); a.textContent = t; a.className = 'visible ' + (tipo || '');
    clearTimeout(a._t); a._t = setTimeout(function () { a.className = tipo || ''; }, ms || (tipo === 'error' ? 6000 : 3000));
  }
  function vibrar(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function guardarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function leerLocal(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  var PED = leerLocal('gp_pedidos') || []; // pedidos por cobrar de este celular
  function borrarLocal(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function cargando() { return '<div class="esqueleto"><i class="alto"></i><i style="width:80%"></i><i style="width:60%"></i><i class="alto"></i></div>'; }
  function hora24() { return new Date(Date.now() - 5 * 3600e3).toISOString().slice(11, 16); }
  function idNuevo(pref) { return pref + '-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 7).toUpperCase(); }

  var ICON = (function () {

  // Botón que dispara una llamada queda "ocupado" hasta que responde.
  var ULTIMO_TOQUE = { b: null, t: 0 };
  document.addEventListener('pointerdown', function (e) { var b = e.target.closest && e.target.closest('button'); if (b) ULTIMO_TOQUE = { b: b, t: Date.now() }; }, true);
  function botonOcupado() {
    var b = Date.now() - ULTIMO_TOQUE.t < 600 ? ULTIMO_TOQUE.b : null;
    if (!b || b.closest('.pestanas, .nav-op, .opciones, .medios, .stepper, .interruptor') || b.hasAttribute('data-cerrar')) return null;
    b.classList.add('ocupado'); ULTIMO_TOQUE.t = 0;
    return function () { b.classList.remove('ocupado'); };
  }

  /** Llamada directa al servidor (sin caché). */
  function llamar(fn, args) {
    return new Promise(function (ok, fallo) {
      google.script.run.withSuccessHandler(function (r) { marcarRed(false); ok(r); }).withFailureHandler(function (e) {
        var msg = ((e && e.message) || String(e)).replace(/^(Exception|Error):\s*/, '');
        var sesion = msg.indexOf('SESION_VENCIDA') >= 0;
        if (sesion) { cerrarSesion(true); msg = 'La sesión venció. Ingrese de nuevo.'; }
        var red = !sesion && /network|failed to fetch|NetworkError|conexi|timeout|tiempo|Script error|load failed/i.test(msg);
        if (red) { marcarRed(true); msg = 'Sin conexión a internet. Intente de nuevo cuando vuelva la señal.'; }
        var err = new Error(msg); err.red = red; err.sesion = sesion;
        fallo(err);
      })[fn].apply(null, fn === 'login' ? args : [SES ? SES.token : null].concat(args));
    });
  }

   * El aviso "Sin conexión" sale en la barra de arriba y se quita solo apenas una llamada al servidor responde.
   */
  var SIN_RED = false;
  function marcarRed(sin) {
    if (sin === SIN_RED) return;
    SIN_RED = sin;
    pintarRed();
    if (!sin && SES && SES.rol !== 'SOCIO') enviarCola();
  }
  function pintarRed() {
    var el = $('chipRed');
    if (el) { el.hidden = !SIN_RED; el.textContent = 'Sin conexión' + (SIN_RED && !$('opVista') ? ' · ' + textoDisco() : ''); }
    pintarEstadoCaja();
  }
  window.addEventListener('offline', function () { marcarRed(true); });
  window.addEventListener('online', function () { if (SES) { marcarRed(false); enviarCola(); enviarMarcas(); if (!$('opVista') && AD.hoy) precargarPanel(); } });

  /*
   * Velocidad: las pantallas del panel se guardan en memoria. Al volver a una pestaña se pinta al instante con lo guardado
   * y, si tiene más de 20 segundos, se pide lo nuevo por detrás y se repinta solo si cambió. Cualquier cambio (venta, gasto,
   * precio, usuario...) borra lo guardado, así que después de guardar algo siempre se ve el dato real.
   */
  var LECTURAS = { adminInit: '', adminInicio: 'inicio', adminVentas: 'ventas', adminTurnos: 'cajas', adminTurno: '', adminDiario: 'diario', adminGastos: 'gastos', adminHoras: 'horas', adminActivos: 'activos', adminResultados: 'resultados', adminInforme: 'informes', adminUsuarios: 'usuarios' };
  var SOLO_LEE = { login: 1, logout: 1, validarSesion: 1, adminInit: 1, opInit: 1, opEstado: 1 };
  var GUARDADO = {}, FRESCO_MS = 20000;
  function copia(x) { return x === undefined ? x : JSON.parse(JSON.stringify(x)); }
  function olvidarGuardado() { GUARDADO = {}; if (SES) borrarLocal('gp_datos_' + SES.usuario); }
  /* Arranque instantáneo: lo último que vio el panel queda en el celular (solo del día) y se muestra apenas abre la app,
     mientras llega lo nuevo. Se borra al cerrar sesión y con cualquier cambio. Los operadores no guardan nada de esto. */
  /* Sin señal se usa lo guardado aunque sea de otro día (VIEJO), avisando de cuándo es. */
  var T_DISCO = null, VIEJO = {}, DISCO_T = 0;
  function guardarDisco() {
    if (!SES || SES.rol === 'OPERADOR') return;
    clearTimeout(T_DISCO);
    T_DISCO = setTimeout(function () {
      if (!SES) return;
      var d = {}, x = leerLocal('gp_datos_' + SES.usuario);
      if (x && x.v === 2 && x.d) d = x.d; // lo de otras pantallas que no se ha vuelto a pedir se conserva
      // La lista de usuarios (nombres y celulares) no se guarda en el celular.
      Object.keys(GUARDADO).forEach(function (k) { if (GUARDADO[k].listo && GUARDADO[k].t && k.indexOf('adminUsuarios') !== 0) d[k] = { data: GUARDADO[k].data, t: GUARDADO[k].t }; });
      guardarLocal('gp_datos_' + SES.usuario, { v: 2, d: d });
    }, 800);
  }
  function restaurarDisco() {
    var x = leerLocal('gp_datos_' + SES.usuario), hoy = hoyISO();
    VIEJO = {}; DISCO_T = 0;
    if (!x || x.v !== 2 || !x.d) return;
    Object.keys(x.d).forEach(function (k) {
      var e = x.d[k]; DISCO_T = Math.max(DISCO_T, e.t || 0);
      if (new Date(e.t - 5 * 3600e3).toISOString().slice(0, 10) === hoy) { if (!GUARDADO[k]) GUARDADO[k] = { listo: true, data: e.data, t: 0 }; }
      else VIEJO[k] = e;
    });
  }
  function textoDisco() {
    var t = DISCO_T;
    Object.keys(GUARDADO).forEach(function (k) { if (GUARDADO[k].t) t = Math.max(t, GUARDADO[k].t); });
    if (!t) return 'sin datos guardados';
    var d = new Date(t - 5 * 3600e3).toISOString();
    return 'datos del ' + fechaCorta(d.slice(0, 10)).slice(0, 5) + ' a las ' + d.slice(11, 16);
  }
  function aplicarInit(r) { AD.productos = r.productos; AD.usuarios = r.usuarios; AD.cat = r.catalogos; AD.hoy = r.hoy; AD.libro = r.libro; }
  function leerRapido(fn, args, liberar) {
    var k = fn + JSON.stringify(args), e = GUARDADO[k];
    if (e && e.listo) {
      liberar();
      if (Date.now() - e.t > FRESCO_MS && !e.enCurso) {
        e.enCurso = true; REFRESCANDO++;
        llamar(fn, args).then(function (r) {
          finRefresco();
          var cambio = JSON.stringify(r) !== JSON.stringify(e.data);
          GUARDADO[k] = { listo: true, data: r, t: Date.now() }; guardarDisco();
          if (cambio && fn === 'adminInit') aplicarInit(r);
          if (cambio) repintarSiSeVe(fn);
        }, function () { e.enCurso = false; finRefresco(true); });
      }
      return Promise.resolve(copia(e.data));
    }
    if (e && e.promesa) return e.promesa.then(function (r) { liberar(); return copia(r); }, function (er) { liberar(); throw er; });
    var p = llamar(fn, args).then(function (r) { GUARDADO[k] = { listo: true, data: r, t: Date.now() }; guardarDisco(); return r; }, function (er) {

  }
  /** Si llegó un dato nuevo de la pantalla que está a la vista, se repinta sin parpadeo (y nunca mientras alguien escribe o tiene una ventana abierta). */
  function repintarSiSeVe(fn) {
    if (!SES || !AD.seccion || LECTURAS[fn] !== AD.seccion || !$('vista')) return;
    if (document.querySelector('.velo-modal')) return;
    var a = document.activeElement; if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
    var y = window.scrollY; VISTAS[AD.seccion](); window.scrollTo(0, y);
  }
  /*
   * Panel en vivo: cada 8 segundos, con el panel a la vista y con señal, se pregunta al servidor si cambió algo
   * (una venta, un gasto, un cierre). Si cambió, todo lo guardado se marca como viejo y la pantalla abierta se
   * vuelve a pedir y se repinta sola. Con la app en segundo plano no pregunta, para no gastar batería ni datos.
   */
  var VERSION_DATOS = null, PIDIENDO_VERSION = false, VIVO_MS = 8000;
  function revisarCambios() {
    if (!SES || SES.rol === 'OPERADOR' || !AD.seccion || !$('vista') || SIN_RED || PIDIENDO_VERSION || document.visibilityState === 'hidden') return;
    PIDIENDO_VERSION = true;
    llamar('adminVersion', []).then(function (v) {
      PIDIENDO_VERSION = false;
      var antes = VERSION_DATOS; VERSION_DATOS = v;
      if (antes === null || antes === v) return;
      Object.keys(GUARDADO).forEach(function (k) { if (GUARDADO[k].listo) GUARDADO[k].t = 0; });
      // Pide de nuevo lo de la pantalla abierta; leerRapido repinta solo si llegó algo distinto.
      var fn = Object.keys(LECTURAS).filter(function (f) { return LECTURAS[f] === AD.seccion; })[0];
      if (fn) repintarSiSeVe(fn);
    }, function () { PIDIENDO_VERSION = false; });
  }
  setInterval(revisarCambios, VIVO_MS);
  /*
   * Botón Actualizar (Samuel, 24 oct 2026): además del panel en vivo, trae ya mismo lo último de la pantalla abierta.
   * Marca todo lo guardado como viejo y repinta: se ve lo que había y en un momento llega lo nuevo del servidor.
   */
  var REFRESCANDO = 0, PIDIO_ACTUALIZAR = false, FALLO_ACTUALIZAR = false;
  function finRefresco(fallo) {
    REFRESCANDO = Math.max(0, REFRESCANDO - 1);
    if (fallo) FALLO_ACTUALIZAR = true;
    if (REFRESCANDO || !PIDIO_ACTUALIZAR) return;
    PIDIO_ACTUALIZAR = false;
    if ($('btnActualizar')) $('btnActualizar').classList.remove('girando');
    aviso(FALLO_ACTUALIZAR ? 'No se pudo actualizar: revisa la señal' : 'Actualizado', FALLO_ACTUALIZAR ? 'error' : 'exito');
  }
  function actualizarAhora() {
    if (!SES || !AD.seccion || !$('vista') || PIDIO_ACTUALIZAR) return;
    if (SIN_RED) { aviso('Sin señal: se muestran los últimos datos guardados', 'error'); return; }
    Object.keys(GUARDADO).forEach(function (k) { if (GUARDADO[k].listo) { GUARDADO[k].t = 0; GUARDADO[k].enCurso = false; } });
    PIDIO_ACTUALIZAR = true; FALLO_ACTUALIZAR = false;
    $('btnActualizar').classList.add('girando');
    var y = window.scrollY; VISTAS[AD.seccion](); window.scrollTo(0, y);

    setTimeout(function () { if (PIDIO_ACTUALIZAR && !REFRESCANDO) { REFRESCANDO = 1; finRefresco(); } }, 400);
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') revisarCambios(); });

  /** Precarga en segundo plano las pestañas del panel para que abran al instante. */
  function precargarPanel() {
    var hoy = AD.hoy, mes = hoy.slice(0, 7), sem = rangoPreset('semana');
    var lista = [
      ['adminTurnos', [{ estado: '' }]], ['adminVentas', [{ desde: hoy, hasta: hoy, usuario: '', medio: '', estado: '', texto: '' }]],
      ['adminGastos', [mes + '-01', hoy]], ['adminDiario', [mes]], ['adminResultados', []], ['adminActivos', []],
      ['adminInforme', [sem[0], sem[1]]], ['adminUsuarios', []]
    ];
    var i = 0;
    var siguiente = function () {
      if (!SES || i >= lista.length) return;
      var x = lista[i++];
      leerRapido(x[0], x[1], function () {}).then(siguiente, siguiente);
    };
    siguiente(); siguiente(); // dos a la vez para no saturar el servidor
  }

  /** Llama una función del servidor con el token y devuelve una promesa. */
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    var liberar = botonOcupado() || function () {};
    if (LECTURAS.hasOwnProperty(fn)) return leerRapido(fn, args, liberar);
    if (SES && SES.rol === 'SOCIO' && !SOLO_LEE[fn]) { liberar(); return Promise.reject(new Error('Su usuario es de solo lectura: puede ver todo pero no cambiar nada.')); }
    return llamar(fn, args).then(function (r) { if (!SOLO_LEE[fn]) { olvidarGuardado(); recargarLuego(); } liberar(); return r; },
      function (e) { if (!SOLO_LEE[fn] && !e.red) olvidarGuardado(); liberar(); throw e; });
  }
  /** Después de un cambio, el panel vuelve a guardar sus pantallas en el celular para poder verlas si se va la señal. */
  var T_RECARGA = null;
  function recargarLuego() {
    if (!SES || SES.rol === 'OPERADOR' || !AD.hoy) return;
    clearTimeout(T_RECARGA); T_RECARGA = setTimeout(function () { if (SES && $('vista')) precargarPanel(); }, 2500);
  }

  /** Modal (en celular sale desde abajo). Devuelve el elemento .modal; se cierra con m.cerrar(). */
  // ================= Aviso de privacidad (Ley 1581 de 2012) y reglas de uso =================
  var CONTACTO_DATOS = 'voffstar.com@gmail.com';
  function verAviso() {
    modal('Privacidad y uso', '<div class="aviso-texto">' +

      '<h3>Qué datos se guardan</h3><p>Nombre, usuario y celular (opcional) de quienes usan la app; las ventas, gastos, aperturas y cierres de caja que cada persona registra; la fecha y hora de cada ingreso y de cada intento fallido. El PIN se guarda cifrado; nadie puede verlo.</p>' +

  // ================= Accesibilidad =================
  // Asocia cada etiqueta con su campo, nombra los campos de las tablas y deja las tablas con scroll alcanzables con teclado.
  var ACC_N = 0, ACC_PEND = false;
  function accesible() {
    ACC_PEND = false;
    if (document.body.classList.contains('solo-lectura')) $$('#vista td input, #vista td select, #rCap, #rCuo').forEach(function (x) { x.readOnly = true; x.disabled = true; });
    $$('label:not([for])').forEach(function (l) {

    });
    $$('input:not([type=hidden]):not([aria-label]), select:not([aria-label]), textarea:not([aria-label])').forEach(function (c) {
      if (c.closest('label') || (c.id && document.querySelector('label[for="' + c.id + '"]'))) return;
      var t = c.placeholder || c.title || '', td = c.closest('td');
      if (!t && td) {
        var tabla = td.closest('table'), th = tabla && tabla.querySelectorAll('thead th')[td.cellIndex];

      }

  function modal(titulo, html, opciones) {

  /** Hoja inferior en celular: se arrastra hacia abajo para cerrar (sigue el dedo, resiste hacia arriba y usa la velocidad al soltar). */
  function arrastrarHoja(m, velo) {
    var mq = window.matchMedia('(max-width: 640px)');
    var y0 = 0, dy = 0, hist = [], activo = false, id = null;
    var elastico = function (x, d) { return (x * d * 0.55) / (d + 0.55 * Math.abs(x)); };
    var proyectar = function (v) { return (v / 1000) * 0.998 / (1 - 0.998); };
    var inicio = function (e) {
      if (!mq.matches || e.button > 0 || e.target.closest('[data-cerrar]')) return;
      activo = true; id = e.pointerId; y0 = e.clientY; dy = 0; hist = [{ y: e.clientY, t: e.timeStamp }];
      try { e.currentTarget.setPointerCapture(id); } catch (er) {}
      m.classList.add('arrastrando');
    };
    var mover = function (e) {
      if (!activo || e.pointerId !== id) return;
      dy = e.clientY - y0; hist.push({ y: e.clientY, t: e.timeStamp }); if (hist.length > 6) hist.shift();

    };

      if (dy + proyectar(v) > m.offsetHeight * 0.5 && dy > 8) { m.cerrar(); return; }
      m.style.transform = ''; velo.style.background = '';
    };
    m.querySelectorAll('.agarre, header').forEach(function (z) {
      z.addEventListener('pointerdown', inicio); z.addEventListener('pointermove', mover);
      z.addEventListener('pointerup', fin); z.addEventListener('pointercancel', fin);
    });
  }

  function confirmar(titulo, texto, boton, peligro) {

  // ================= Sesión =================
  function cerrarSesion(vencida) {

    olvidarGuardado(); SES = null; borrarLocal('gp_sesion'); borrarLocal('gp_vista');
    location.hash = '';
    document.body.className = '';

  }

  var HTML_LOGIN = $('raiz').innerHTML;
  function iniciarLogin() {
    $('logoLogin').src = IMG.logo;
    $('lAviso').onclick = verAviso;
    var u = leerLocal('gp_usuario'); if (u) { $('lUsuario').value = u; }
    var ir = function () {
      $('lError').textContent = '';
      var usuario = $('lUsuario').value.trim().toLowerCase(), pin = $('lPin').value.trim();
      if (!usuario || !pin) { $('lError').textContent = 'Escriba usuario y PIN.'; return; }
      ULTIMO_TOQUE = { b: $('btnIngresar'), t: Date.now() };
      var disp = leerLocal('gp_disp');
      if (!disp) { disp = idNuevo('D') + '-' + Math.random().toString(36).slice(2, 12).toUpperCase(); guardarLocal('gp_disp', disp); }
      // Cuánto tardó el ingreso anterior en este celular: el servidor lo anota en el registro para medir la velocidad real.
      var t0 = Date.now();
      api('login', usuario, pin, disp, leerLocal('gp_vista') === 'caja' ? 'op' : 'panel', Number(leerLocal('gp_ms_ingreso')) || 0).then(function (s) {
        guardarLocal('gp_ms_ingreso', Date.now() - t0);
        var d = s.datos || {}; delete s.datos;
        guardarLocal('gp_usuario', usuario);
        s.ini = Date.now();
        // La primera pantalla llega con el ingreso: queda lista sin otra llamada al servidor.
        var k = function (fn) { return fn + '[]'; };

        if (d.opInit) {
          var o = d.opInit;
          guardarLocal('gp_op_' + s.usuario, { productos: o.productos, canales: o.canales, categorias: o.categoriasCaja, srv: { turno: o.turno || null, ventas: o.ventas || [], gastos: o.gastos || [] }, marca: o.marca || null, t: Date.now(), fresco: true });

  (function arrancar() {

    }).withFailureHandler(function () {}).validarSesion(s.token);
  })();
</script>

<script>

    // Sin señal la caja arranca con lo último que trajo del servidor más lo que está por enviar.
    var g = leerLocal(opKey());

    });
  }

  /*
   * La caja sin internet: OP.srv es lo último que respondió el servidor y la cola guarda, en orden, lo que falta enviar
   * (apertura, ventas, gastos y cierre). Lo que se ve en pantalla (OP.turno, OP.ventas, OP.gastos) es la suma de las dos.
   */
  function opKey() { return 'gp_op_' + (SES ? SES.usuario : ''); }
  function guardarOp() { if (SES) guardarLocal(opKey(), { productos: OP.productos, canales: OP.canales, categorias: OP.categorias, srv: OP.srv, marca: OP.marca || null, t: Date.now() }); }
  function opAplicarEstado(r) {
    OP.srv = { turno: r.turno || null, ventas: r.ventas || [], gastos: r.gastos || [] };
    derivar(); guardarOp(); pintarEstadoCaja();
  }
  function derivar() {
    var srv = OP.srv || { turno: null, ventas: [], gastos: [] };
    // La propina se muestra cuando el servidor ya la guarda (versión publicada desde el 17 oct 2026).
    if (srv.turno && 'propinasEfectivo' in srv.turno && !leerLocal('gp_propina_ok')) guardarLocal('gp_propina_ok', 1);
    var t = srv.turno ? JSON.parse(JSON.stringify(srv.turno)) : null, gastos = (srv.gastos || []).slice(), alias = {};
    cola().forEach(function (x) {
      if (x.error) return;
      var tipo = x.tipo || 'venta';
      if (tipo === 'abrir') {
        if (t) { alias[x.id] = t.id; return; }
        t = { id: x.id, fecha: x.local.fecha, estado: 'ABIERTO', abre: SES.nombre, apertura: x.local.fecha + ' ' + x.local.hora, base: x.base,
          ventasN: 0, vasos: 0, efectivo: 0, transferencia: 0, total: 0, gastos: 0, esperado: x.base, pendiente: true };
        gastos = [];

      }
      if (!t || (alias[x.turno] || x.turno) !== t.id) return;
      if (tipo === 'venta') {
        t.ventasN++; t.vasos += x.vasos || 0; t.total += x.total;
        var pr = x.propina || 0;
        if (x.medio === 'EFECTIVO') { t.efectivo += x.total; t.esperado += x.total + pr; t.propinasEfectivo = (t.propinasEfectivo || 0) + pr; } else { t.transferencia += x.total; t.propinasTransferencia = (t.propinasTransferencia || 0) + pr; }
        t.propinas = (t.propinas || 0) + pr;
      } else if (tipo === 'gasto') {
        t.gastos += x.valor; t.esperado -= x.valor;
        gastos.unshift({ id: x.id, hora: x.local.hora, categoria: x.categoria, proveedor: x.proveedor, descripcion: x.descripcion, valor: x.valor, usuario: SES.nombre, estado: 'ACTIVO', pendiente: true });
      } else if (tipo === 'cerrar') { t = null; gastos = []; }
    });
    OP.turno = t; OP.gastos = t ? gastos : [];
    OP.ventas = t && srv.turno && srv.turno.id === t.id ? srv.ventas : [];
  }
  /*
   * Entrada y salida del operador (control de horas extra). Va en su propia cola del celular: se marca aunque no haya señal
   * y se envía al volver la conexión con la hora real de la marca. OP.marca = {hoy: {fecha, entrada, salida}, entrada, salida}.
   */
  function marcasKey() { return 'gp_marcas_' + (SES ? SES.usuario : ''); }
  function marcasPendientes() { return leerLocal(marcasKey()) || []; }
  function marcaDeHoy() {
    var h = OP.marca && OP.marca.hoy, hoy = hoyISO();
    if (!h) return null;
    if (h.fecha === hoy) return h;
    // Turno que pasó la medianoche: sigue abierto hasta las 6 de la mañana.
    return h.fecha === sumarDias(hoy, -1) && h.entrada && hora24() < '06:00' ? h : null;
  }
  function aplicarMarcasPendientes() {
    marcasPendientes().forEach(function (x) {
      var h = marcaDeHoy();
      if (x.tipo === 'ENTRADA') { if (!h || h.fecha !== x.fecha) OP.marca.hoy = { fecha: x.fecha, entrada: x.hora, salida: '' }; else if (!h.entrada) h.entrada = x.hora; }
      else if (h) h.salida = h.fecha === x.fecha ? x.hora : (Number(x.hora.slice(0, 2)) + 24) + x.hora.slice(2);
    });
  }
  function pintarMarca() {
    var el = $('marcaBar'); if (!el) return;
    if (!OP.marca) { el.hidden = true; return; }
    var h = marcaDeHoy(), pend = marcasPendientes().length, horario = 'Horario ' + OP.marca.entrada + ' a ' + OP.marca.salida;

    el.innerHTML = !h || !h.entrada
      ? '<span>¿Ya llegaste?<small>' + horario + '</small></span><button class="amarillo" data-marca="ENTRADA">Marcar entrada</button>'
      : !h.salida
        ? '<span>Entrada ' + esc(h.entrada) + '<small>' + horario + (pend ? ' · por enviar' : '') + '</small></span><button class="amarillo" data-marca="SALIDA">Marcar salida</button>'
        : '<span>' + (h.fecha === hoyISO() ? 'Hoy' : 'Ayer') + ': ' + esc(h.entrada) + ' a ' + esc(horaTurno(h.salida)) + '<small>' + (pend ? 'Por enviar' : 'Guardado') + '</small></span><button class="sec" data-marca="SALIDA">Salí más tarde</button>';
    $$('[data-marca]', el).forEach(function (b) { b.onclick = function () { marcar(b.getAttribute('data-marca')); }; });
  }
  /** GPS del celular para comprobar que la marca se hace en el punto. Funciona sin señal; nunca tarda más de 12 s. */
  function ubicacion() {
    return new Promise(function (ok) {
      var listo = false, fin = function (x) { if (!listo) { listo = true; ok(x); } };
      if (!navigator.geolocation) return fin({ ubicError: 'apagado' });
      setTimeout(function () { fin({ ubicError: 'tiempo' }); }, 12000);
      try {
        navigator.geolocation.getCurrentPosition(function (p) { fin({ ubic: { lat: p.coords.latitude, lng: p.coords.longitude, prec: Math.round(p.coords.accuracy) } }); },
          function (e) { fin({ ubicError: e.code === 1 ? 'permiso' : e.code === 3 ? 'tiempo' : 'apagado' }); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
      } catch (e) { fin({ ubicError: 'apagado' }); }

  }
  var MARCANDO = false;
  function marcar(tipo) {
    if (MARCANDO) return;

    // una salida después de medianoche el servidor la pasa al turno del día anterior.

    confirmar(tipo === 'ENTRADA' ? 'Marcar entrada' : 'Marcar salida', (tipo === 'ENTRADA' ? 'Entrada' : 'Salida') + ' a las <b>' + hora + '</b>.<br><span class="gris peq">Se guarda la ubicación del celular para comprobar que estás en el punto.</span>', 'Marcar').then(function (si) {
      if (!si) return;

        var c = marcasPendientes(); c.push(x); guardarLocal(marcasKey(), c);

      ENVIANDO_MARCAS = false;
      if (r && r.verificada === false) aviso('Marca guardada. El administrador la revisará: ' + r.prueba, 'error', 8000);
      guardarLocal(marcasKey(), marcasPendientes().filter(function (y) { return y.id !== x.id; }));
      OP.marca.hoy = r.marca; aplicarMarcasPendientes(); guardarOp(); pintarMarca();

      aviso('No se guardó la marca: ' + e.message, 'error'); pintarMarca();
    });
  }
  function cola() { return leerLocal(colaKey()) || []; }
  function guardarCola(c) { guardarLocal(colaKey(), c); derivar(); pintarEstadoCaja(); }
  function agregarCola(x) { var c = cola(); c.push(x); guardarCola(c); }
  function pendientes() { return cola().filter(function (x) { return !x.error; }).length; }
  /** Vuelve a pintar la pestaña de la caja sin borrar lo que se esté escribiendo. */
  function repintarOp() {
    if (!$('opVista') || document.querySelector('.velo-modal')) return;

    pintarTab();
  }
  /** Repinta la pestaña abierta aunque un cuadro se esté cerrando. */
  function pintarTab() {
    if (!$('opVista')) return;
    if (!OP.turno && OP.tab !== 'ventas') { pintarAbrirCaja(); pintarCarrito(); return; }
    ({ vender: pintarVender, fila: pintarFila, ventas: pintarVentasTurno, gastos: pintarGastosCaja, cierre: pintarCierre })[OP.tab]();
    pintarCarrito();
  }

  function pintarEstadoCaja() {
    var t = OP.turno, pend = cola().length;
    var el = $('estadoCaja'); if (!el) return;
    el.innerHTML = (SIN_RED ? '<span class="sin-red">Sin señal</span>' : '') + (t ? 'Vendido en caja<b>' + pesos(t.total) + '</b>' : 'Caja cerrada');
    var nav = $$('#navOp button[data-tab="ventas"]')[0];

  function pintarAbrirCaja() {
    $('opVista').innerHTML = '<div class="abrir-caja"><img src="' + IMG.personaje + '" alt=""><div class="tarjeta">' +
      '<h2>Abrir caja</h2><p class="gris">¿Con cuánto efectivo empieza la caja hoy?</p>' +
      '<label for="base">Base en efectivo</label><input id="base" value="" placeholder="0">' +
      '<div class="billetes"><button class="sec" data-b="0">$0</button><button class="sec" data-b="50000">$50.000</button><button class="sec" data-b="100000">$100.000</button></div>' +
      '<button class="grande amarillo" id="btnAbrir" style="margin-top:16px">Abrir caja</button></div></div>';
    campoPesos($('base'));
    $$('[data-b]').forEach(function (b) { b.onclick = function () { $('base').value = Number(b.getAttribute('data-b')).toLocaleString('es-CO'); }; });

      if ($('base').value.trim() === '') { aviso('Escriba la base (puede ser 0)', 'error'); return; }

  // ---------- Vender ----------
  function lineas() {
    var orden = [], m = {};
    OP.productos.forEach(function (p) {
      if (!m[p.linea]) { m[p.linea] = { linea: p.linea, grupo: p.grupo, desc: p.desc, img: p.img, color: p.color, mas18: p.mas18 && !p.adicion, opciones: p.opciones, orden: p.orden || 99, destacado: p.destacado || '', variantes: [] }; orden.push(m[p.linea]); }

    $('opVista').innerHTML = '<div id="porCobrar"></div><div class="productos">' + lineas().map(function (l) {

      return '<div class="prod" data-linea="' + esc(l.linea) + '" style="--c:' + esc(l.color) + '">' +
        (enCarrito[l.linea] ? '<span class="en-carrito">' + enCarrito[l.linea] + '</span>' : '') + (l.mas18 ? '<span class="mas18">+18</span>' : '') +
        (IMG[l.img] ? '<img src="' + IMG[l.img] + '" alt="">' : '') + (l.destacado ? '<span class="destacado">★ ' + esc(l.destacado) + '</span>' : '') + '<b>' + esc(l.grupo) + '</b><small>' + esc(l.desc) + '</small>' +

    $$('.prod').forEach(function (el) { el.onclick = function () { elegirTamano(el.getAttribute('data-linea')); }; });
