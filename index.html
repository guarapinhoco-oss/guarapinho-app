      }).join('') + '</tbody></table></div>';
    $('rMes').onchange = function () { AD.mesSel = Number(this.value); pintarResultados(); };
    $$('[data-mes]').forEach(function (tr) { tr.onclick = function () { AD.mesSel = Number(tr.getAttribute('data-mes')); pintarResultados(); window.scrollTo(0, 0); }; });
    campoPesos($('rCap'));
    $('rGuardarCap').onclick = function () {
      confirmar('Préstamo', 'Esto cambia la cuota en "Capital Inversionista" y con ella el flujo de caja y el reparto. ¿Guardar?', 'Guardar').then(function (s) {
        if (!s) return;
        api('adminGuardarCapital', numeroDe($('rCap').value), numeroDe($('rCuo').value)).then(function (r2) { AD.resultados = r2; pintarResultados(); aviso('Préstamo actualizado', 'exito'); }).catch(function (e) { aviso(e.message, 'error'); });
      });
    };
    $$('.interruptor').forEach(function (it) {
      $$('button', it).forEach(function (b) {
        b.onclick = function () {
          if (b.classList.contains('sel')) return;
          api('adminGuardarCumplio', m.num, Number(it.getAttribute('data-socio')), b.getAttribute('data-v')).then(function (mes) {
            r.meses = r.meses.map(function (x) { return x.num === mes.num ? mes : x; }); pintarResultados(); aviso('Reparto actualizado', 'exito');
          }).catch(function (e) { aviso(e.message, 'error'); });
        };
      });
    });
  }

  // ---------- Informes ----------
  function rangoPreset(k) {
    var h = AD.hoy, p = h.split('-').map(Number);
    var dow = (new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay() + 6) % 7; // lunes = 0
    var lunes = sumarDias(h, -dow);
    var ini = h.slice(0, 7) + '-01';
    var finMesPas = sumarDias(ini, -1);
    return { hoy: [h, h], semana: [lunes, h], semanaPasada: [sumarDias(lunes, -7), sumarDias(lunes, -1)], mes: [ini, h], mesPasado: [finMesPas.slice(0, 7) + '-01', finMesPas] }[k];
  }
  function vInformes() {
    var f = AD.fInforme || { desde: rangoPreset('semana')[0], hasta: rangoPreset('semana')[1] };
    $('vista').innerHTML = '<div class="pestanas no-imprimir" id="pInf">' + [['hoy', 'Hoy'], ['semana', 'Esta semana'], ['semanaPasada', 'Semana pasada'], ['mes', 'Este mes'], ['mesPasado', 'Mes pasado']].map(function (x) { return '<button data-p="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
      '<div class="filtros no-imprimir"><div><label>Desde</label><input type="date" id="iDesde" value="' + f.desde + '"></div><div><label>Hasta</label><input type="date" id="iHasta" value="' + f.hasta + '"></div><div style="flex:0 0 auto"><button id="iVer">Ver informe</button></div><div style="flex:0 0 auto"><button class="sec" id="iImp">' + ICON.imprimir + ' Imprimir</button></div></div><div id="iRes">' + cargando() + '</div>';
    $$('#pInf button').forEach(function (b) { b.onclick = function () { var r = rangoPreset(b.getAttribute('data-p')); $('iDesde').value = r[0]; $('iHasta').value = r[1]; ver(); }; });
    $('iImp').onclick = function () { window.print(); };
    var ver = function () {
      AD.fInforme = { desde: $('iDesde').value, hasta: $('iHasta').value };
      $('iRes').innerHTML = cargando();
      api('adminInforme', AD.fInforme.desde, AD.fInforme.hasta).then(pintarInforme).catch(function (e) { $('iRes').innerHTML = '<p class="error">' + esc(e.message) + '</p>'; });
    };
    $('iVer').onclick = ver;
    ver();
  }
  function pintarInforme(r) {
    var t = r.totales, a = r.app;
    var horas = Object.keys(a.porHora).sort().map(function (h) { return { h: h, v: a.porHora[h], corto: a.porHora[h] }; });
    var prods = r.porProducto.slice().sort(function (x, y) { return y.unidades - x.unidades; });
    $('iRes').innerHTML = '<h2>Informe del ' + fechaCorta(r.desde) + ' al ' + fechaCorta(r.hasta) + '</h2>' +
      '<div class="kpis">' + kpi('Ingresos', pesos(t.ingreso), t.vasos + ' vasos · ' + t.diasConVenta + ' días con venta', 'destacado') + kpi('Costo insumos', pesos(t.costo)) + kpi('Margen', pesos(t.margen), pct(t.ingreso ? t.margen / t.ingreso : 0)) +
      kpi('Gastos fijos', pesos(r.gastos.total)) + kpi('Utilidad neta', pesos(r.utilidadNeta), 'Margen − gastos fijos', r.utilidadNeta < 0 ? 'negativo' : '') +
      kpi('Recibido', pesos(t.recibido), 'Efectivo ' + pesos(t.efectivo) + ' · Transf. ' + pesos(t.transferencia)) + kpi('Diferencia de caja', pesos(t.diferencia), '', t.diferencia < 0 ? 'negativo' : '') +
      kpi('Pagos a proveedores', pesos(r.pagos.pagado), r.pagos.pendiente ? 'Pendiente ' + pesos(r.pagos.pendiente) : '') + kpi('Flujo del periodo', pesos(r.flujo), 'Recibido − gastos − proveedores', r.flujo < 0 ? 'negativo' : '') + '</div>' +
      '<div class="seccion-grid"><div><h3>Por producto</h3><div class="tabla-scroll"><table><thead><tr><th>Producto</th><th class="n">Vasos</th><th class="n">Ingreso</th><th class="n">Margen</th></tr></thead><tbody>' + prods.map(function (p) {
        return '<tr><td>' + esc(p.nombre) + '</td><td class="n">' + p.unidades + '</td><td class="n">' + pesos(p.ingreso) + '</td><td class="n">' + pesos(p.ingreso - p.costo) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<h3>Por día</h3><div class="tabla-scroll"><table><thead><tr><th>Día</th><th class="n">Vasos</th><th class="n">Ingreso</th><th class="n">Recibido</th><th class="n">Diferencia</th></tr></thead><tbody>' + r.dias.filter(function (d) { return d.vasos || d.recibido; }).map(function (d) {
        return '<tr><td>' + diaSemana(d.fecha) + ' ' + fechaCorta(d.fecha) + '</td><td class="n">' + d.vasos + '</td><td class="n">' + pesos(d.ingreso) + '</td><td class="n">' + pesos(d.recibido) + '</td><td class="n ' + (d.diferencia < 0 ? 'neg' : '') + '">' + pesos(d.diferencia) + '</td></tr>';
      }).join('') + '</tbody></table></div></div><div>' +
      '<h3>Vasos por hora (app)</h3><div class="tarjeta">' + (horas.length ? barras(horas, 'v', function (x) { return x.h + 'h'; }) : '<div class="vacio">Sin ventas en la app.</div>') + '</div>' +
      '<h3>Por vendedor (app)</h3><div class="tabla-scroll"><table><tbody>' + (a.porVendedor.length ? a.porVendedor.map(function (v) { return '<tr><td>' + esc(v.nombre) + '</td><td class="n">' + v.ventas + ' ventas</td><td class="n">' + v.vasos + ' vasos</td><td class="n">' + pesos(v.total) + '</td></tr>'; }).join('') : '<tr><td class="gris">Sin datos</td></tr>') + '</tbody></table></div>' +
      '<h3>Medios de pago (app)</h3><div class="tabla-scroll"><table><tbody>' + a.porCanal.map(function (c) { return '<tr><td>' + esc(c.nombre) + '</td><td class="n">' + pesos(c.valor) + '</td></tr>'; }).join('') +
      '<tr><td>Ticket promedio</td><td class="n">' + pesos(a.ticket) + '</td></tr><tr><td>Anuladas</td><td class="n">' + a.anuladas + ' · ' + pesos(a.valorAnulado) + '</td></tr>' +
      Object.keys(a.opciones).map(function (o) { return '<tr><td>Borde ' + esc(o) + '</td><td class="n">' + a.opciones[o] + ' vasos</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<h3>Gastos fijos por categoría</h3><div class="tabla-scroll"><table><tbody>' + (r.gastos.porCategoria.length ? r.gastos.porCategoria.map(function (c) { return '<tr><td>' + esc(c.nombre) + '</td><td class="n">' + pesos(c.valor) + '</td></tr>'; }).join('') : '<tr><td class="gris">Sin gastos</td></tr>') + '</tbody></table></div>' +
      '<h3>Proveedores pagados por categoría</h3><div class="tabla-scroll"><table><tbody>' + (r.pagos.porCategoria.length ? r.pagos.porCategoria.map(function (c) { return '<tr><td>' + esc(c.nombre) + '</td><td class="n">' + pesos(c.valor) + '</td></tr>'; }).join('') : '<tr><td class="gris">Sin pagos</td></tr>') + '</tbody></table></div>' +
      '</div></div>';
  }

  // ---------- Precios y costos ----------
  function vPrecios() {
    var p = AD.productos;
    $('vista').innerHTML = '<p class="gris peq">Hoja "Precios y Costos". Los cambios de precio se ven de inmediato en la caja y en todos los cálculos del archivo. Los costos en gris se calculan solos en la hoja "Recetas y Costeo" (precio de cada insumo y receta de cada producto): se cambian allá.</p>' +
      '<div class="tabla-scroll"><table><thead><tr><th>Producto</th><th class="n">Precio de venta</th><th class="n">Costo unitario</th><th class="n">Margen</th><th class="n">% Margen</th></tr></thead><tbody>' + p.map(function (x, i) {
        return '<tr><td><b>' + esc(x.nombre) + '</b></td><td class="n"><input data-pr="' + i + '" value="' + x.precio + '" style="width:110px;text-align:right"></td><td class="n"><input data-co="' + i + '" value="' + x.costo + '" style="width:110px;text-align:right"' + (x.costoAuto ? ' disabled title="Se calcula en la hoja Recetas y Costeo"' : '') + '></td><td class="n" id="mg' + i + '"></td><td class="n" id="mp' + i + '"></td></tr>';
      }).join('') + '</tbody></table></div><div class="acciones" style="display:flex;justify-content:flex-end;margin-top:14px"><button id="pGuardar">Guardar precios y costos</button></div>';
    var calc = function () { p.forEach(function (x, i) { var pr = numeroDe($$('[data-pr="' + i + '"]')[0].value), co = numeroDe($$('[data-co="' + i + '"]')[0].value); $('mg' + i).textContent = pesos(pr - co); $('mp' + i).textContent = pr ? pct((pr - co) / pr) : ''; }); };
    $$('[data-pr],[data-co]').forEach(function (i) { campoPesos(i); i.addEventListener('input', calc); });
    calc();
    $('pGuardar').onclick = function () {
      var lista = p.map(function (x, i) { return { fila: x.fila, precio: numeroDe($$('[data-pr="' + i + '"]')[0].value), costo: numeroDe($$('[data-co="' + i + '"]')[0].value) }; });
      api('adminGuardarPrecios', lista).then(function (r) { AD.productos = r; aviso('Precios guardados en el archivo', 'exito'); vPrecios(); }).catch(function (e) { aviso(e.message, 'error'); });
    };
  }

  // ---------- Usuarios ----------
  function vUsuarios() { api('adminUsuarios').then(pintarUsuarios).catch(fallaVista); }
  function pintarUsuarios(lista) {
    AD.usuarios = lista;
    $('vista').innerHTML = '<div class="encabezado-seccion"><h2>Usuarios</h2><button class="amarillo" id="uNuevo">' + ICON.mas + ' Nuevo usuario</button></div>' +
      '<p class="gris peq" style="margin-top:-6px">ADMIN: ve y cambia todo, y también puede vender. SOCIO: ve todo el panel pero no puede cambiar nada ni vender. OPERADOR: solo la caja (vender, gastos de caja y cierre).</p>' +
      '<div class="lista">' + lista.map(function (u) {
        return '<div class="item clic" data-u="' + esc(u.usuario) + '" style="cursor:pointer"><div class="avatar" style="width:38px;height:38px;border-radius:50%;background:' + (u.rol === 'ADMIN' ? 'var(--verde)' : u.rol === 'SOCIO' ? 'var(--azul)' : 'var(--amarillo)') + ';color:' + (u.rol === 'OPERADOR' ? '#3a2f00' : '#fff') + ';display:flex;align-items:center;justify-content:center;font-weight:900">' + esc(u.nombre.charAt(0)) + '</div>' +
          '<div class="d"><b>' + esc(u.nombre) + '</b><span>' + esc(u.usuario) + (u.telefono ? ' · ' + esc(u.telefono) : '') + '</span></div>' + (u.activo ? '' : '<span class="chip gris">Inactivo</span>') + '<span class="chip ' + (u.rol === 'ADMIN' ? '' : u.rol === 'SOCIO' ? 'azul' : 'amarillo') + '">' + ({ ADMIN: 'Admin', SOCIO: 'Socio · solo lectura', OPERADOR: 'Operador' }[u.rol] || u.rol) + '</span></div>';
      }).join('') + '</div>';
    $('uNuevo').onclick = function () { formUsuario(null); };
    $$('[data-u]').forEach(function (el) { el.onclick = function () { formUsuario(lista.filter(function (u) { return u.usuario === el.getAttribute('data-u'); })[0]); }; });
  }
  function formUsuario(u) {
    var nuevo = !u; u = u || { usuario: '', nombre: '', rol: 'OPERADOR', activo: true, telefono: '' };
    var m = modal(nuevo ? 'Nuevo usuario' : 'Editar ' + u.nombre, '<label>Nombre</label><input id="uN" value="' + esc(u.nombre) + '">' +
      '<label>Usuario de ingreso</label><input id="uU" value="' + esc(u.usuario) + '" autocapitalize="none" ' + (nuevo ? '' : 'disabled') + ' placeholder="ej: mariana">' +
      '<label>Rol</label><div class="medios roles"><button data-r="OPERADOR" class="' + (u.rol === 'OPERADOR' ? 'sel' : '') + '">Operador</button><button data-r="SOCIO" class="' + (u.rol === 'SOCIO' ? 'sel' : '') + '">Socio</button><button data-r="ADMIN" class="' + (u.rol === 'ADMIN' ? 'sel' : '') + '">Admin</button></div>' +
      '<div class="grid2"><div><label>' + (nuevo ? 'PIN (operador 4 a 8 dígitos; socio y admin 6 a 8)' : 'PIN nuevo (vacío = no cambiar)') + '</label><input id="uP" inputmode="numeric" maxlength="8"></div><div><label>Celular</label><input id="uT" inputmode="tel" value="' + esc(u.telefono) + '"></div></div>' +
      '<label class="fila" style="margin-top:12px"><input type="checkbox" id="uA" class="auto"' + (u.activo ? ' checked' : '') + '> <span>Activo (puede ingresar)</span></label>' +
      '<div class="acciones"><button id="uG">Guardar</button></div>');
    var rol = u.rol;
    $$('.medios button', m).forEach(function (b) { b.onclick = function () { rol = b.getAttribute('data-r'); $$('.medios button', m).forEach(function (x) { x.classList.toggle('sel', x === b); }); }; });
    m.querySelector('#uG').onclick = function () {
      var d = { usuario: m.querySelector('#uU').value.trim().toLowerCase(), nombre: m.querySelector('#uN').value.trim(), rol: rol, pin: m.querySelector('#uP').value.trim(), telefono: m.querySelector('#uT').value.trim(), activo: m.querySelector('#uA').checked };
      api('adminGuardarUsuario', d).then(function (l) { m.cerrar(); aviso('Usuario guardado', 'exito'); pintarUsuarios(l); }).catch(function (e) { aviso(e.message, 'error'); });
    };
  }
</script>
</body>
</html>
